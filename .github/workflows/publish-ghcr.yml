name: Publish Docker image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          expected_version="${GITHUB_REF_NAME#v}"
          if [ ! -f VERSION ]; then
            echo "::error file=VERSION::Missing VERSION file for release tag v$expected_version."
            exit 1
          fi

          # VERSION normally stores bare SemVer; accept an accidental leading v.
          actual_version="$(tr -d '\r\n' < VERSION)"
          actual_version="${actual_version#v}"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::Tag v$expected_version requires VERSION=$expected_version, found $actual_version."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/astakos-ai-agent
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build release image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          load: true
          platforms: linux/amd64
          tags: astakos-release-smoke:latest

      - name: Smoke test API import inside release image
        run: |
          docker run --rm \
            -e LLM_PROVIDER=vertex \
            -e GOOGLE_APPLICATION_CREDENTIALS=/tmp/fake-vertex.json \
            -e PROJECT_ID=smoke-test-project \
            -e LOCATION=us-central1 \
            --entrypoint /bin/sh \
            astakos-release-smoke:latest \
            -lc "printf '{}' > /tmp/fake-vertex.json && cd /opt/astakos && python -c 'import api.server; print(\"release-smoke-ok\")'"

      - name: Build and push release image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.release
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
