services:
  astakos:
    image: ghcr.io/alexneverland/astakos-ai-agent:latest
    container_name: astakos_agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - astakos_data:/app
      - ./credentials:/app/credentials:ro
      - astakos_workspace:/workspace
    environment:
      PYTHONUNBUFFERED: "1"
      ASTAKOS_CHECK_UPDATES: "0"
      ASTAKOS_SETUP_HOST: "0.0.0.0"
      ASTAKOS_CONTAINER: "1"
      ASTAKOS_TOKEN_PATH: "/workspace/token.json"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: astakos_watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup --interval 300

volumes:
  astakos_data:
  astakos_workspace:
