<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<title>Αστακός Avatar Test</title>
<style>
  body { background: #1e1e1e; display: flex; flex-direction: column; align-items: center; padding: 30px; font-family: 'Segoe UI', sans-serif; }
  .btns { display: flex; gap: 12px; margin-bottom: 30px; }
  button { padding: 10px 22px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; font-weight: bold; background: #333; color: #ccc; transition: 0.2s; }
  button:hover { background: #444; }
  button.active { background: #c8360a; color: white; }
  #avatar-container { width: 260px; height: 320px; }

  /* IDLE: blink */
  @keyframes blink {
    0%,88%,100% { transform: scaleY(1); }
    93% { transform: scaleY(0.05); }
  }
  .eye-blink { animation: blink 3.5s infinite; transform-box: fill-box; transform-origin: center; }

  /* IDLE: antenna sway */
  @keyframes ant-sway-l { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(4deg)} }
  @keyframes ant-sway-r { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(-4deg)} }
  .ant-idle-l { animation: ant-sway-l 2.5s infinite ease-in-out; transform-box: fill-box; transform-origin: bottom center; }
  .ant-idle-r { animation: ant-sway-r 2.5s 0.4s infinite ease-in-out; transform-box: fill-box; transform-origin: bottom center; }

  /* LISTENING: antenna wobble fast */
  @keyframes ant-wobble-l { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(-10deg)} 75%{transform:rotate(8deg)} }
  @keyframes ant-wobble-r { 0%,100%{transform:rotate(0deg)} 25%{transform:rotate(10deg)} 75%{transform:rotate(-8deg)} }
  .ant-listen-l { animation: ant-wobble-l 0.7s infinite ease-in-out; transform-box: fill-box; transform-origin: bottom center; }
  .ant-listen-r { animation: ant-wobble-r 0.7s 0.1s infinite ease-in-out; transform-box: fill-box; transform-origin: bottom center; }

  /* LISTENING: ear rings */
  @keyframes ring-out { 0%{r:10;opacity:0.8} 100%{r:26;opacity:0} }
  .ear-ring  { animation: ring-out 1.1s infinite ease-out; }
  .ear-ring2 { animation: ring-out 1.1s 0.4s infinite ease-out; }

  /* THINKING: pupils look up */
  @keyframes look-up { 0%,60%,100%{transform:translateY(0)} 30%{transform:translateY(-4px)} }
  .pupil-think { animation: look-up 1.6s infinite; transform-box: fill-box; transform-origin: center; }

  /* THINKING: thought bubbles float */
  @keyframes float-up { 0%,100%{transform:translateY(0);opacity:0.85} 50%{transform:translateY(-7px);opacity:1} }
  .think-bubble { animation: float-up 1.6s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }

  /* SPEAKING: mouth */
  @keyframes mouth-open { 0%,100%{d:path("M 88 108 Q 110 114 132 108")} 50%{d:path("M 88 108 Q 110 126 132 108")} }
  .mouth-anim { animation: mouth-open 0.35s infinite ease-in-out; }

  /* SPEAKING: sound waves */
  @keyframes wave-fade { 0%{opacity:0.9;transform:scaleX(1)} 100%{opacity:0;transform:scaleX(1.4)} }
  .wave1 { animation: wave-fade 0.9s infinite ease-out; transform-box: fill-box; transform-origin: left center; }
  .wave2 { animation: wave-fade 0.9s 0.3s infinite ease-out; transform-box: fill-box; transform-origin: left center; }
  .wave3 { animation: wave-fade 0.9s 0.6s infinite ease-out; transform-box: fill-box; transform-origin: left center; }

  /* SPEAKING: body pulse */
  @keyframes body-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.015)} }
  .body-pulse { animation: body-pulse 0.35s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }

  /* state groups */
  .s { display: none; }
  .s.on { display: block; }
</style>
</head>
<body>

<div class="btns">
  <button onclick="setState('idle')"      id="b-idle">😴 Idle</button>
  <button onclick="setState('listening')" id="b-listening">🎙️ Listening</button>
  <button onclick="setState('thinking')"  id="b-thinking">🤔 Thinking</button>
  <button onclick="setState('speaking')"  id="b-speaking">🔊 Speaking</button>
</div>

<div id="avatar-container">
<svg id="lobster-svg" width="260" height="320" viewBox="0 0 220 300" xmlns="http://www.w3.org/2000/svg">

  <!-- TAIL -->
  <ellipse cx="110" cy="252" rx="42" ry="16" fill="#b52e08"/>
  <ellipse cx="110" cy="266" rx="30" ry="12" fill="#9e2606"/>
  <ellipse cx="110" cy="278" rx="20" ry="9"  fill="#8a2006"/>
  <ellipse cx="92"  cy="286" rx="13" ry="6"  fill="#9e2606" transform="rotate(-14 92 286)"/>
  <ellipse cx="110" cy="289" rx="11" ry="5"  fill="#8a2006"/>
  <ellipse cx="128" cy="286" rx="13" ry="6"  fill="#9e2606" transform="rotate(14 128 286)"/>

  <!-- LEGS -->
  <line x1="80"  y1="215" x2="58"  y2="248" stroke="#8a2006" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="88"  y1="230" x2="68"  y2="260" stroke="#8a2006" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="95"  y1="243" x2="78"  y2="270" stroke="#8a2006" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="140" y1="215" x2="162" y2="248" stroke="#8a2006" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="132" y1="230" x2="152" y2="260" stroke="#8a2006" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="125" y1="243" x2="142" y2="270" stroke="#8a2006" stroke-width="1.8" stroke-linecap="round"/>

  <!-- BODY -->
  <ellipse cx="110" cy="200" rx="62" ry="68" fill="#c8360a" stroke="#8a2006" stroke-width="1.2"/>
  <line x1="50"  y1="178" x2="170" y2="178" stroke="#8a2006" stroke-width="0.8" opacity="0.5"/>
  <line x1="50"  y1="198" x2="170" y2="198" stroke="#8a2006" stroke-width="0.8" opacity="0.5"/>
  <line x1="52"  y1="218" x2="168" y2="218" stroke="#8a2006" stroke-width="0.8" opacity="0.5"/>
  <line x1="56"  y1="234" x2="164" y2="234" stroke="#8a2006" stroke-width="0.8" opacity="0.5"/>

  <!-- HEAD -->
  <ellipse cx="110" cy="138" rx="52" ry="52" fill="#d94010" stroke="#8a2006" stroke-width="1.2"/>

  <!-- EYES white -->
  <circle cx="90"  cy="125" r="13" fill="white" stroke="#8a2006" stroke-width="1"/>
  <circle cx="130" cy="125" r="13" fill="white" stroke="#8a2006" stroke-width="1"/>

  <!-- ═══ IDLE ═══ -->
  <g class="s on" id="s-idle">
    <g class="eye-blink">
      <circle cx="90"  cy="125" r="8" fill="#1a1a1a"/>
      <circle cx="92"  cy="122" r="2.5" fill="white"/>
    </g>
    <g class="eye-blink">
      <circle cx="130" cy="125" r="8" fill="#1a1a1a"/>
      <circle cx="132" cy="122" r="2.5" fill="white"/>
    </g>
    <path d="M 92 160 Q 110 170 128 160" fill="none" stroke="#7a1a04" stroke-width="2.5" stroke-linecap="round"/>
    <g class="ant-idle-l">
      <line x1="88" y1="90" x2="65" y2="48" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
      <circle cx="65" cy="48" r="4" fill="#f05020"/>
    </g>
    <g class="ant-idle-r">
      <line x1="132" y1="90" x2="155" y2="48" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
      <circle cx="155" cy="48" r="4" fill="#f05020"/>
    </g>
    <!-- claws -->
    <ellipse cx="34"  cy="188" rx="24" ry="16" fill="#c8360a" stroke="#8a2006" stroke-width="1.2"/>
    <ellipse cx="186" cy="188" rx="24" ry="16" fill="#c8360a" stroke="#8a2006" stroke-width="1.2"/>
    <line x1="18" y1="181" x2="28" y2="188" stroke="#7a1a04" stroke-width="1.2"/>
    <line x1="192" y1="181" x2="202" y2="188" stroke="#7a1a04" stroke-width="1.2"/>
  </g>

  <!-- ═══ LISTENING ═══ -->
  <g class="s" id="s-listening">
    <circle cx="90"  cy="125" r="9" fill="#1a1a1a"/>
    <circle cx="92"  cy="122" r="3" fill="white"/>
    <circle cx="130" cy="125" r="9" fill="#1a1a1a"/>
    <circle cx="132" cy="122" r="3" fill="white"/>
    <path d="M 92 160 Q 110 166 128 160" fill="none" stroke="#7a1a04" stroke-width="2" stroke-linecap="round"/>
    <!-- ear rings -->
    <circle cx="60"  cy="132" r="10" fill="none" stroke="#f05020" stroke-width="1.5" class="ear-ring"/>
    <circle cx="60"  cy="132" r="10" fill="none" stroke="#f05020" stroke-width="1"   class="ear-ring2"/>
    <circle cx="160" cy="132" r="10" fill="none" stroke="#f05020" stroke-width="1.5" class="ear-ring"/>
    <circle cx="160" cy="132" r="10" fill="none" stroke="#f05020" stroke-width="1"   class="ear-ring2"/>
    <g class="ant-listen-l">
      <line x1="88" y1="90" x2="60" y2="42" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
      <circle cx="60" cy="42" r="5" fill="#f05020"/>
    </g>
    <g class="ant-listen-r">
      <line x1="132" y1="90" x2="160" y2="42" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
      <circle cx="160" cy="42" r="5" fill="#f05020"/>
    </g>
    <!-- raised claws -->
    <ellipse cx="32" cy="168" rx="22" ry="15" fill="#c8360a" stroke="#8a2006" stroke-width="1.2" transform="rotate(-20 32 168)"/>
    <ellipse cx="188" cy="168" rx="22" ry="15" fill="#c8360a" stroke="#8a2006" stroke-width="1.2" transform="rotate(20 188 168)"/>
  </g>

  <!-- ═══ THINKING ═══ -->
  <g class="s" id="s-thinking">
    <g class="pupil-think">
      <circle cx="92"  cy="122" r="8" fill="#1a1a1a"/>
      <circle cx="94"  cy="119" r="2.5" fill="white"/>
    </g>
    <g class="pupil-think">
      <circle cx="132" cy="122" r="8" fill="#1a1a1a"/>
      <circle cx="134" cy="119" r="2.5" fill="white"/>
    </g>
    <path d="M 96 162 Q 110 158 124 162" fill="none" stroke="#7a1a04" stroke-width="2" stroke-linecap="round"/>
    <g class="think-bubble">
      <circle cx="148" cy="82" r="4"  fill="#f05020" opacity="0.5"/>
      <circle cx="158" cy="65" r="7"  fill="#f05020" opacity="0.7"/>
      <circle cx="170" cy="46" r="10" fill="#f05020" opacity="0.85"/>
      <text x="170" y="50" text-anchor="middle" font-size="11" fill="white" font-weight="bold">?</text>
    </g>
    <line x1="88" y1="90" x2="68" y2="46" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
    <circle cx="68" cy="46" r="4" fill="#f05020"/>
    <line x1="132" y1="90" x2="152" y2="46" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
    <circle cx="152" cy="46" r="4" fill="#f05020"/>
    <!-- claw on chin -->
    <ellipse cx="110" cy="222" rx="20" ry="12" fill="#c8360a" stroke="#8a2006" stroke-width="1.2"/>
    <ellipse cx="34"  cy="190" rx="22" ry="14" fill="#c8360a" stroke="#8a2006" stroke-width="1.2"/>
    <ellipse cx="186" cy="190" rx="22" ry="14" fill="#c8360a" stroke="#8a2006" stroke-width="1.2"/>
  </g>

  <!-- ═══ SPEAKING ═══ -->
  <g class="s" id="s-speaking">
    <g class="body-pulse">
      <circle cx="90"  cy="125" r="8" fill="#1a1a1a"/>
      <circle cx="92"  cy="122" r="2.5" fill="white"/>
      <circle cx="130" cy="125" r="8" fill="#1a1a1a"/>
      <circle cx="132" cy="122" r="2.5" fill="white"/>
      <path class="mouth-anim" d="M 88 108 Q 110 114 132 108" fill="none" stroke="#7a1a04" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- sound waves -->
    <path class="wave1" d="M 168 148 Q 178 160 168 172" fill="none" stroke="#f05020" stroke-width="2" stroke-linecap="round"/>
    <path class="wave2" d="M 178 138 Q 194 160 178 182" fill="none" stroke="#f05020" stroke-width="1.5" stroke-linecap="round"/>
    <path class="wave3" d="M 188 128 Q 210 160 188 192" fill="none" stroke="#f05020" stroke-width="1" stroke-linecap="round"/>
    <!-- antennas up -->
    <line x1="88" y1="90" x2="62" y2="40" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
    <circle cx="62" cy="40" r="5" fill="#f05020"/>
    <line x1="132" y1="90" x2="158" y2="40" stroke="#8a2006" stroke-width="2" stroke-linecap="round"/>
    <circle cx="158" cy="40" r="5" fill="#f05020"/>
    <!-- expressive claws open -->
    <ellipse cx="32"  cy="192" rx="26" ry="16" fill="#c8360a" stroke="#8a2006" stroke-width="1.2" transform="rotate(12 32 192)"/>
    <ellipse cx="188" cy="192" rx="26" ry="16" fill="#c8360a" stroke="#8a2006" stroke-width="1.2" transform="rotate(-12 188 192)"/>
  </g>

</svg>
</div>

<p id="state-label" style="color:#888; margin-top:16px; font-size:14px;">State: idle</p>

<script>
function setState(s) {
  ['idle','listening','thinking','speaking'].forEach(st => {
    document.getElementById('s-' + st).classList.remove('on');
    document.getElementById('b-' + st).classList.remove('active');
  });
  document.getElementById('s-' + s).classList.add('on');
  document.getElementById('b-' + s).classList.add('active');
  document.getElementById('state-label').textContent = 'State: ' + s;
}
setState('idle');

// Για τον Αστακό σου - εξάγεις αυτή τη function
window.setAstakosState = setState;
</script>

</body>
</html>
