<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🦞 Astakos Runtime Dashboard</title>
<style>
  :root {
    --bg:#0d1117;--card:#161b22;--border:#30363d;
    --text:#e6edf3;--muted:#8b949e;--green:#3fb950;
    --red:#f85149;--yellow:#d29922;--blue:#58a6ff;
    --purple:#bc8cff;--orange:#f0883e;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',monospace;font-size:13px;padding:16px;}
  h1{font-size:20px;margin-bottom:4px;}
  .ts{color:var(--muted);font-size:11px;margin-bottom:16px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:14px;}
  .card h2{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px;}
  table{width:100%;border-collapse:collapse;}
  th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;padding:4px 6px;text-align:left;border-bottom:1px solid var(--border);}
  td{padding:5px 6px;border-bottom:1px solid #21262d;vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .ok{color:var(--green);}.warn{color:var(--yellow);}.err{color:var(--red);}.off{color:var(--muted);}
  .badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;}
  .b-green{background:#1a3a1f;color:var(--green);}
  .b-yellow{background:#3a2d0a;color:var(--yellow);}
  .b-red{background:#3a0d0d;color:var(--red);}
  .b-blue{background:#0d2240;color:var(--blue);}
  .b-purple{background:#220d3a;color:var(--purple);}
  .b-orange{background:#3a1e0a;color:var(--orange);}
  .b-muted{background:#1c2128;color:var(--muted);}
  .kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #21262d;}
  .kv:last-child{border-bottom:none;}
  .kv .k{color:var(--muted);}.kv .v{font-weight:600;}
  .bar-wrap{background:#21262d;border-radius:4px;height:6px;width:100%;margin-top:3px;}
  .bar-fill{height:6px;border-radius:4px;background:var(--green);transition:width .4s;}
  #refresh-bar{height:2px;background:var(--blue);transition:width .1s linear;position:fixed;top:0;left:0;z-index:99;}
  #charts-btn:hover{background:#0d2240;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
<div id="refresh-bar" style="width:0%"></div>
<h1>🦞 Astakos Runtime Dashboard</h1>
<div class="ts" id="ts">Φόρτωση...</div>
<div class="grid" id="grid"></div>
<div style="margin-top:16px">
  <button onclick="openCharts()" style="background:#1a2a3a;color:var(--blue);border:1px solid var(--blue);padding:7px 18px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;">📊 Γραφήματα</button>
</div>

<!-- Charts Modal -->
<div id="charts-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;overflow-y:auto;padding:20px;">
  <div style="background:#161b22;border:1px solid #30363d;border-radius:10px;max-width:900px;margin:0 auto;padding:20px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="font-size:16px;color:#e6edf3;">📊 Analytics</h2>
      <button onclick="closeCharts()" style="background:#3a0d0d;color:#f85149;border:none;padding:4px 12px;border-radius:5px;cursor:pointer;font-size:14px;">✕ Κλείσιμο</button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="card"><h2>🗓️ Routine States</h2><div style="height:220px;position:relative"><canvas id="chart-routines"></canvas></div></div>
      <div class="card"><h2>⚡ Agent Usage (1h)</h2><div style="height:220px;position:relative"><canvas id="chart-agents"></canvas></div></div>
      <div class="card"><h2>📈 Event Throughput (1h)</h2><div style="height:220px;position:relative"><canvas id="chart-throughput"></canvas></div></div>
      <div class="card"><h2>✅ Confirmations (today)</h2><div style="height:220px;position:relative"><canvas id="chart-confirmations"></canvas></div></div>
    </div>
  </div>
</div>
<div class="grid" id="timeline-section" style="margin-top:16px"></div>
<div class="grid" id="goals-section" style="margin-top:16px"></div>
<div class="grid" id="reflections-section" style="margin-top:16px"></div>
<script>
const REFRESH = 5000;
let rafId;
let timelineData = [];

function actionIcon(a){
  return {triggered:'🧠',confirmed:'✅',dismissed:'📉',timeout_decay:'⏰',
          decay:'💀',cooldown_extended:'🔄',state_change:'🔀',skipped:'⏭️'}[a]||'•';
}
function actionColor(a){
  return {confirmed:'ok',dismissed:'warn',decay:'err',timeout_decay:'warn',
          cooldown_extended:'warn',skipped:'off'}[a]||'';
}
function extraInfo(e){
  if(e.action==='decay')            return `conf→${e.new_confidence?.toFixed(2)??'?'} (${e.new_state??''})`;
  if(e.action==='cooldown_extended')return `cd=${e.new_cooldown_hours??'?'}h ignore#${e.ignore_count??'?'}`;
  if(e.action==='state_change')     return `${e.from_state??'?'}→${e.to_state??'?'}`;
  if(e.action==='triggered')        return `conf=${e.confidence?.toFixed(2)??'?'}${e.batch?` batch=${e.batch}`:''}`;
  if(e.action==='timeout_decay')    return `${e.elapsed_s??'?'}s elapsed`;
  if(e.action==='skipped')          return e.reason??'';
  return '';
}
function logRow(e) {
  const ts  = (e.timestamp||'').substring(11,19);
  const act = e.action||'?';
  const job = e.job||'?';
  const col = {complete:'ok',error:'err',db_error:'err',disabled:'err',
               confirmed:'ok',triggered:'',dismissed:'warn',
               timeout_decay:'warn',decay:'err',skipped:'off',
               start:'off',alert_sent:'warn'}[act]||'';
  const extra = Object.entries(e)
    .filter(([k])=>!['timestamp','job','action'].includes(k))
    .map(([k,v])=>`<span class="off">${k}:</span>${v}`)
    .join(' &nbsp;');
  return `<tr class="log-row" data-filter="${job} ${act}">
    <td class="off" style="white-space:nowrap;font-size:11px">${ts}</td>
    <td style="font-size:11px">${job}</td>
    <td><span class="${col}">${act}</span></td>
    <td style="font-size:11px;color:var(--muted)">${extra}</td>
  </tr>`;
}
function renderTimelineCard(){
  const container = document.getElementById('timeline-section');
  if(!container) return;
  if(!timelineData.length){
    container.innerHTML = '';
    return;
  }
  const rows = [...timelineData].reverse().slice(0,60).map(e=>{
    const ts   = (e.timestamp||'').substring(11,19);
    const date = (e.timestamp||'').substring(5,10);
    return `<tr>
      <td class="off" style="white-space:nowrap;font-size:11px">${date} ${ts}</td>
      <td>${actionIcon(e.action)} <span class="${actionColor(e.action)}">${e.action}</span></td>
      <td class="off">#${e.routine_id??'?'}</td>
      <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${e.event||'—'}</td>
      <td class="off" style="font-size:11px">${extraInfo(e)}</td>
    </tr>`;
  }).join('');
  container.innerHTML = `<div class="card" style="grid-column:1/-1">
    <h2>📜 Routine Timeline (last 2 days)</h2>
    <table><tr><th>Time</th><th>Action</th><th>ID</th><th>Event</th><th>Info</th></tr>
    ${rows}</table></div>`;
}
async function fetchTimeline(){
  try{
    const r = await fetch('/debug/replay?days=2');
    timelineData = (await r.json()).events||[];
    renderTimelineCard();
  }catch(e){}
}

function stateBadge(s) {
  const m = {
    active:['b-green','ACTIVE'], trigger_pending:['b-yellow','TRIGGER_PENDING'],
    confirmed:['b-blue','CONFIRMED'], ignored:['b-orange','IGNORED'],
    dismissed:['b-purple','DISMISSED'], decayed:['b-red','DECAYED'],
    archived:['b-muted','ARCHIVED'], learned:['b-muted','LEARNED'],
  };
  const [c,l] = m[s] || ['b-muted', s];
  return `<span class="badge ${c}">${l}</span>`;
}

function jobRow(j) {
  const icon = j.disabled ? '🚫' : j.fail_count > 0 ? '⚠️' : '✅';
  const next = j.disabled ? '—' : `${j.next_in_secs}s`;
  const dur  = j.last_duration != null ? `${j.last_duration.toFixed(2)}s` : '—';
  return `<tr>
    <td>${icon} <b>${j.name}</b></td>
    <td class="off">${j.last_run||'—'}</td>
    <td class="${j.disabled?'err':'ok'}">${next}</td>
    <td>${dur}</td>
    <td class="${j.fail_count>0?'warn':'ok'}">${j.fail_count}</td>
  </tr>${j.last_error?`<tr><td colspan="5" class="err" style="font-size:11px;padding:2px 6px 6px">↳ ${j.last_error}</td></tr>`:''}`;
}

function confBar(v) {
  const p = Math.round(v*100);
  const c = v>=0.8?'var(--green)':v>=0.5?'var(--yellow)':'var(--red)';
  return `${p}% <div class="bar-wrap"><div class="bar-fill" style="width:${p}%;background:${c}"></div></div>`;
}

function render(d) {
  const s = d.scheduler||{}, ovr = d.overrides||{}, rout = d.routines||{};
  const evts = d.events_1h||{}, pend = d.pending_confirmations||[];
  const stale = d.snapshot_age_s != null && d.snapshot_age_s > 30;
  const age = d.snapshot_age_s != null
    ? `(snapshot ${d.snapshot_age_s}s ago${stale?' ⚠️ STALE':''})` : '(telegram_bot offline?)';

  document.getElementById('ts').innerHTML =
    `Τελευταία ανανέωση: <b>${new Date().toLocaleTimeString('el-GR')}</b> &nbsp;${age}`;

  const flags = [];
  if (ovr.sleeping)        flags.push(`<span class="badge b-red">😴 Sleep until ${ovr.sleep_until}</span>`);
  if (ovr.pause_reminders) flags.push('<span class="badge b-yellow">⏸ Reminders Paused</span>');
  if (ovr.mute_proactive)  flags.push('<span class="badge b-yellow">🔇 Proactive Muted</span>');
  if (s.quiet_hours)       flags.push('<span class="badge b-muted">🌙 Quiet Hours</span>');

  let html = '';

  html += `<div class="card"><h2>⚙️ Scheduler Jobs</h2>
    ${flags.length?'<div style="margin-bottom:8px">'+flags.join(' ')+'</div>':''}
    <table><tr><th>Job</th><th>Last Run</th><th>Next</th><th>Dur</th><th>Fails</th></tr>
    ${(s.jobs||[]).map(jobRow).join('')}</table></div>`;

  html += `<div class="card"><h2>📊 Queue &amp; Rate</h2>
    <div class="kv"><span class="k">Queue size</span><span class="v ${s.queue_size>5?'warn':''}">${s.queue_size??'?'}</span></div>
    <div class="kv"><span class="k">Proactive this hour</span><span class="v">${s.proactive_this_hour??0} / 3</span></div>
    <div class="kv"><span class="k">Pending confirmations</span><span class="v ${s.pending_count>0?'warn':''}">${s.pending_count??0}</span></div>
    <div class="kv"><span class="k">Total events today</span><span class="v">${evts.total_today??0}</span></div>
  </div>`;

  if (pend.length > 0) {
    html += `<div class="card"><h2>⏳ Pending Confirmations</h2>
      <table><tr><th>ID</th><th>Event</th><th>Elapsed</th><th>Timeout in</th></tr>
      ${pend.map(p=>`<tr>
        <td class="off">#${p.routine_id}</td><td>${p.event}</td>
        <td class="${p.elapsed_min>25?'warn':''}">${p.elapsed_min}m</td>
        <td class="${p.timeout_in_min<5?'err':'ok'}">${p.timeout_in_min}m</td>
      </tr>`).join('')}</table></div>`;
  }

  const acts = d.pending_actions||[];
  if (acts.length > 0) {
    html += `<div class="card"><h2>🔐 Pending Actions (${acts.length})</h2>
      <table><tr><th>Tool</th><th>Args</th><th>Requested</th><th>Ενέργειες</th></tr>
      ${acts.map(a=>`<tr>
        <td><b>${a.tool_name}</b></td>
        <td class="off" style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis">${JSON.stringify(a.tool_args||{})}</td>
        <td class="off">${(a.requested_at||'').slice(11,16)}</td>
        <td style="white-space:nowrap">
          <button onclick="resolveAction('${a.tool_call_id}','approve')" style="background:#1a4a2a;color:#4ade80;border:none;padding:3px 10px;border-radius:4px;cursor:pointer;margin-right:4px">✅ Approve</button>
          <button onclick="resolveAction('${a.tool_call_id}','reject')"  style="background:#4a1a1a;color:#f87171;border:none;padding:3px 10px;border-radius:4px;cursor:pointer">❌ Reject</button>
        </td>
      </tr>`).join('')}</table></div>`;
  }

  if ((rout.active||[]).length > 0) {
    html += `<div class="card" style="grid-column:span 2"><h2>🗓️ Active Routines (${rout.active.length})</h2>
      <table><tr><th>ID</th><th>Day</th><th>Time</th><th>Event</th><th>Confidence</th><th>Cooldown left</th><th>State</th><th>Ενέργειες</th></tr>
      ${rout.active.map(r=>`<tr>
        <td class="off">#${r.id}</td><td>${r.day}</td><td><b>${r.time}</b></td>
        <td>${r.event}</td>
        <td style="min-width:80px">${confBar(r.confidence)}</td>
        <td class="${r.cooldown_remaining_h===0?'ok':r.cooldown_remaining_h>10?'err':'warn'}">${r.cooldown_remaining_h!=null?r.cooldown_remaining_h+'h':'—'}</td>
        <td>${stateBadge(r.state)}</td>
        <td style="white-space:nowrap">
          <button onclick="resetCooldown(${r.id})" title="Reset Cooldown" style="background:#1a3a5a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;margin-right:4px">⚡ Reset</button>
          <button onclick="toggleEdit(${r.id})" style="background:#1a3a5a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;margin-right:4px">✏️ Edit</button>
          <button onclick="deleteRoutine(${r.id})" style="background:#7a2a2a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer">🗑️ Delete</button>
        </td>
      </tr>
      <tr id="edit-row-${r.id}" style="display:none;background:#1a1f2a">
        <td colspan="8" style="padding:8px 12px">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="color:var(--muted);font-size:11px">Day:
              <select id="edit-day-${r.id}" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 7px;width:110px;margin-left:4px">
                ${['Everyday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>`<option value="${d}" ${r.day===d?'selected':''}>${d}</option>`).join('')}
              </select>
            </label>
            <label style="color:var(--muted);font-size:11px">Time:
              <input id="edit-time-${r.id}" value="${r.time}" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 7px;width:70px;margin-left:4px">
            </label>
            <label style="color:var(--muted);font-size:11px">Event:
              <input id="edit-event-${r.id}" value="${r.event}" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 7px;width:220px;margin-left:4px">
            </label>
            <button onclick="saveEdit(${r.id})" style="background:#2a5a2a;color:#fff;border:none;padding:3px 10px;border-radius:4px;cursor:pointer">💾 Save</button>
            <button onclick="toggleEdit(${r.id})" style="background:#3a3a3a;color:#fff;border:none;padding:3px 10px;border-radius:4px;cursor:pointer">✕</button>
          </div>
        </td>
      </tr>`).join('')}</table></div>`;
  }

  const sc = rout.state_counts||{};
  if (Object.keys(sc).length > 0) {
    html += `<div class="card"><h2>📈 Routine State Counts</h2>
      ${Object.entries(sc).map(([st,c])=>`<div class="kv"><span class="k">${stateBadge(st)}</span><span class="v">${c}</span></div>`).join('')}
    </div>`;
  }

  if ((rout.non_active||[]).length > 0) {
    html += `<div class="card" style="grid-column:span 2"><h2>🔄 Non-Active Routines (${rout.non_active.length})</h2>
      <table><tr><th>ID</th><th>Day</th><th>Time</th><th>Event</th><th>State</th><th>Conf</th><th>Ενέργειες</th></tr>
      ${rout.non_active.map(r=>`<tr>
        <td class="off">#${r.id}</td>
        <td>${r.day||'—'}</td>
        <td><b>${r.time||'—'}</b></td>
        <td>${r.event}</td>
        <td>${stateBadge(r.state)}</td>
        <td class="${r.confidence<0.1?'err':r.confidence<0.5?'warn':'ok'}">${r.confidence}</td>
        <td style="white-space:nowrap">
          ${r.state==='trigger_pending'
            ? `<button onclick="confirmRoutine(${r.id})" style="background:#1a5a3a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;margin-right:4px">✅ Confirm</button>`
            : `<button onclick="activateRoutine(${r.id})" style="background:#2a7a2a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;margin-right:4px">▶️ Activate</button>`
          }
          <button onclick="toggleEdit(${r.id})" style="background:#1a3a5a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer;margin-right:4px">✏️ Edit</button>
          <button onclick="deleteRoutine(${r.id})" style="background:#7a2a2a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer">🗑️ Delete</button>
        </td>
      </tr>
      <tr id="edit-row-${r.id}" style="display:none;background:#1a1f2a">
        <td colspan="7" style="padding:8px 12px">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="color:var(--muted);font-size:11px">Day:
              <select id="edit-day-${r.id}" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 7px;width:110px;margin-left:4px">
                ${['Everyday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'].map(d=>`<option value="${d}" ${r.day===d?'selected':''}>${d}</option>`).join('')}
              </select>
            </label>
            <label style="color:var(--muted);font-size:11px">Time:
              <input id="edit-time-${r.id}" value="${r.time||''}" placeholder="HH:MM" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 7px;width:70px;margin-left:4px">
            </label>
            <label style="color:var(--muted);font-size:11px">Event:
              <input id="edit-event-${r.id}" value="${r.event||''}" style="background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:4px;padding:3px 7px;width:180px;margin-left:4px">
            </label>
            <button onclick="saveEdit(${r.id})" style="background:#1a4a7a;color:#fff;border:none;padding:4px 12px;border-radius:4px;cursor:pointer">💾 Save</button>
            <button onclick="toggleEdit(${r.id})" style="background:#2a2a2a;color:var(--muted);border:none;padding:4px 10px;border-radius:4px;cursor:pointer">Cancel</button>
          </div>
        </td>
      </tr>`).join('')}</table></div>`;
  }

  const tp = evts.throughput||{};
  if (Object.keys(tp).length > 0) {
    const mx = Math.max(...Object.values(tp),1);
    html += `<div class="card"><h2>⚡ Event Throughput (last 1h)</h2>
      ${Object.entries(tp).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
        const p = Math.round(v/mx*100);
        return `<div style="margin-bottom:5px">
          <div style="display:flex;justify-content:space-between"><span class="off">${k}</span><b>${v}</b></div>
          <div class="bar-wrap"><div class="bar-fill" style="width:${p}%;background:var(--blue)"></div></div>
        </div>`;
      }).join('')}</div>`;
  }

  if ((evts.last_errors||[]).length > 0) {
    html += `<div class="card"><h2>❌ Last Errors (1h)</h2>
      ${evts.last_errors.map(e=>`<div style="margin-bottom:6px;font-size:12px">
        <span class="off">${e.time}</span> <span class="warn">[${e.job}]</span><br>
        <span class="err">${e.error}</span>
      </div>`).join('')}</div>`;
  }
  const recentLogs = [...(evts.recent_logs||[])].reverse();
  if (recentLogs.length > 0) {
    html += `<div class="card" style="grid-column:1/-1">
      <h2>📋 Live Log (σήμερα — ${recentLogs.length} entries)</h2>
      <div style="margin-bottom:8px;display:flex;gap:8px;align-items:center">
        <input id="log-filter" placeholder="Φίλτρο: job, action..." oninput="filterLogs()"
          style="background:#21262d;border:1px solid var(--border);color:var(--text);
                padding:4px 10px;border-radius:4px;width:220px;font-size:12px">
        <span class="off" style="font-size:11px">Εμφάνιση τελευταίων 100</span>
      </div>
      <div style="max-height:320px;overflow-y:auto">
        <table><tr><th>Time</th><th>Job</th><th>Action</th><th>Details</th></tr>
        ${recentLogs.map(logRow).join('')}</table>
      </div>
    </div>`;
  }
  document.getElementById('grid').innerHTML = html;
}
function filterLogs() {
  const q = document.getElementById('log-filter')?.value.toLowerCase()||'';
  document.querySelectorAll('.log-row').forEach(row => {
    row.style.display = row.dataset.filter?.includes(q) ? '' : 'none';
  });
}
async function fetchData() {
  try {
    const r = await fetch('/debug/runtime');
    const data = await r.json();
    render(data);
    renderCharts(data);
  } catch(e) {
    document.getElementById('ts').innerHTML = `<span class="err">Σφάλμα φόρτωσης: ${e}</span>`;
  }
  // Φόρτωση goals
  try {
    const gr = await fetch('/debug/goals');
    renderGoals((await gr.json()).goals || []);
  } catch(e) {}
  // Φόρτωση reflections
  try {
    const rr = await fetch('/debug/reflections');
    const rj = await rr.json();
    renderReflections(rj.reflections || []);
  } catch(e) {}
}


function renderGoals(goals) {
  const container = document.getElementById('goals-section');
  const icon = s => s==='active'?'🎯':s==='paused'?'⏸':'✅';
  const color = s => s==='active'?'#22c55e':s==='paused'?'#f59e0b':'#6b7280';
  if (!goals.length) {
    container.innerHTML = '<div class="card" style="grid-column:span 2"><h2>🎯 LONG-TERM GOALS</h2><p style="color:var(--muted)">Δεν υπάρχουν goals ακόμα.</p></div>';
    return;
  }
  const rows = goals.map(g =>
    '<tr>'
    + '<td>' + icon(g.status) + ' <span style="color:' + color(g.status) + ';font-weight:600">' + g.status + '</span></td>'
    + '<td><strong>' + g.project + '</strong></td>'
    + '<td>' + g.description + '</td>'
    + '<td style="color:var(--muted);font-size:0.85em">' + g.date + '</td>'
    + '<td><button onclick="deleteGoal(\'' + g.project + '\')" style="background:#7a2a2a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer">🗑 Delete</button></td>'
    + '</tr>').join('');
  container.innerHTML = '<div class="card" style="grid-column:span 2">'
    + '<h2>🎯 LONG-TERM GOALS (' + goals.length + ')</h2>'
    + '<table><tr><th>Status</th><th>Project</th><th>Description</th><th>Date</th><th>Action</th></tr>'
    + rows + '</table></div>';
}
async function deleteGoal(project) {
  if (!confirm('Διαγραφή goal "' + project + '";')) return;
  let token = localStorage.getItem('astakos_token') || prompt('Bearer token:');
  if (!token) return;
  localStorage.setItem('astakos_token', token);
  const res = await fetch('/debug/goals/' + encodeURIComponent(project), {
    method: 'DELETE', headers: {'Authorization': 'Bearer ' + token}
  });
  const j = await res.json();
  if (j.ok) { renderGoals((await (await fetch('/debug/goals')).json()).goals || []); }
  else { alert('Σφάλμα: ' + (j.error||'unknown')); }
}
function renderReflections(reflections) {
  const container = document.getElementById('reflections-section');
  if (!container) return;
  if (!reflections.length) {
    container.innerHTML = '<div class="card" style="grid-column:span 2"><h2>🧠 Reflections</h2><p style="color:var(--muted)">Δεν υπάρχουν reflections ακόμα. Τρέχουν νυχτερινά στις 03:00.</p></div>';
    return;
  }
  const rows = reflections.map(r => `
    <tr>
      <td class="off">#${r.id}</td>
      <td>${r.created_at?.substring(0,16)||'—'}</td>
      <td><span class="badge b-blue">${r.source||'—'}</span></td>
      <td style="max-width:300px">${r.observation}</td>
      <td><code>${r.action}</code></td>
      <td class="${r.confidence>=0.75?'ok':r.confidence>=0.5?'warn':'err'}">${(r.confidence*100).toFixed(0)}%</td>
      <td style="max-width:200px;color:var(--muted);font-size:11px">${r.lesson||'—'}</td>
      <td>${r.applied
        ? '<span class="ok">✅ Applied</span>'
        : `<button onclick="applyReflection(${r.id})" style="background:#1a5a3a;color:#fff;border:none;padding:3px 8px;border-radius:4px;cursor:pointer">▶ Apply</button>`
      }</td>
    </tr>`).join('');
  container.innerHTML = `
    <div class="card" style="grid-column:span 2">
      <h2>🧠 Reflections (${reflections.length})</h2>
      <table>
        <tr><th>ID</th><th>Ημερομηνία</th><th>Πηγή</th><th>Observation</th><th>Action</th><th>Conf</th><th>Lesson</th><th>Status</th></tr>
        ${rows}
      </table>
    </div>`;
}

async function applyReflection(id) {
  if (!confirm(`Εφαρμογή reflection #${id};`)) return;
  const r = await fetch(`/debug/reflection/${id}/apply`, {method:'POST'});
  const j = await r.json();
  if (!j.ok) alert(`Σφάλμα: ${j.error}`);
  fetchData();
}

async function resetCooldown(id) {
  await fetch(`/debug/routine/${id}/reset-cooldown`, {method:'POST'});
  fetchData();
}

async function deleteRoutine(id) {
  if (!confirm(`Διαγραφή ρουτίνας #${id};`)) return;
  await fetch(`/debug/routine/${id}`, {method:'DELETE'});
  fetchData();
}

async function confirmRoutine(id) {
  if (!confirm(`Force-confirm ρουτίνα #${id} → ACTIVE;`)) return;
  const r = await fetch(`/debug/routine/${id}/confirm`, {method:'POST'});
  const j = await r.json();
  if (!j.ok) alert(`Σφάλμα: ${j.error}`);
  fetchData();
}

async function activateRoutine(id) {
  if (!confirm(`Ενεργοποίηση ρουτίνας #${id};`)) return;
  await fetch(`/debug/routine/${id}/state`, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({state:'active'})});
  fetchData();
}

async function resolveAction(toolCallId, decision) {
  const label = decision === 'approve' ? 'Έγκριση' : 'Απόρριψη';
  if (!confirm(`${label} action ${toolCallId}?`)) return;
  await fetch(`/debug/action/${toolCallId}/${decision}`, {method:'POST'});
  fetchData();
}

// ── CHARTS ────────────────────────────────────────────────────
const _charts = {};
let _lastData = null;

function openCharts() {
  document.getElementById('charts-modal').style.display = 'block';
  if (_lastData) renderCharts(_lastData);
}
function closeCharts() {
  document.getElementById('charts-modal').style.display = 'none';
}
// Κλείσιμο με Escape
document.addEventListener('keydown', e => { if(e.key==='Escape') closeCharts(); });

function renderCharts(d) {
  _lastData = d;
  if (document.getElementById('charts-modal').style.display === 'none') return;

  const COLORS = ['#3fb950','#58a6ff','#d29922','#f85149','#bc8cff','#f0883e','#39d353','#79c0ff'];
  const darkGrid = { color: '#21262d' };

  function mkChart(id, type, labels, datasets, opts={}) {
    if (_charts[id]) _charts[id].destroy();
    const ctx = document.getElementById(id)?.getContext('2d');
    if (!ctx) return;
    _charts[id] = new Chart(ctx, {
      type, data: { labels, datasets },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#8b949e', font: { size: 11 } } } },
        scales: type !== 'doughnut' ? {
          x: { ticks: { color: '#8b949e', font:{size:10} }, grid: darkGrid },
          y: { ticks: { color: '#8b949e', font:{size:10} }, grid: darkGrid, beginAtZero: true }
        } : undefined,
        ...opts
      }
    });
  }

  // 1. Routine States — doughnut
  const stateMap = d.routines?.state_counts || {};
  const stateLabels = Object.keys(stateMap);
  mkChart('chart-routines', 'doughnut', stateLabels, [{
    data: stateLabels.map(k => stateMap[k]),
    backgroundColor: COLORS,
    borderColor: '#161b22', borderWidth: 2
  }]);

  // 2. Agent Usage — bar (από throughput: "job/action" → groupby job)
  const throughput = d.events_1h?.throughput || {};
  const agentCounts = {};
  Object.entries(throughput).forEach(([key, count]) => {
    const agent = key.split('/')[0];
    agentCounts[agent] = (agentCounts[agent] || 0) + count;
  });
  const agentLabels = Object.keys(agentCounts);
  mkChart('chart-agents', 'bar', agentLabels, [{
    label: 'Events',
    data: agentLabels.map(k => agentCounts[k]),
    backgroundColor: COLORS,
    borderRadius: 4
  }]);

  // 3. Event Throughput — horizontal bar (top 8 job/action combos)
  const tpEntries = Object.entries(throughput).sort((a,b)=>b[1]-a[1]).slice(0,8);
  mkChart('chart-throughput', 'bar', tpEntries.map(e=>e[0]), [{
    label: 'Count',
    data: tpEntries.map(e=>e[1]),
    backgroundColor: '#58a6ff',
    borderRadius: 4
  }], { indexAxis: 'y' });

  // 4. Routine confirmations today — από event log
  const events = d.events_1h?.recent_logs || [];
  const confByHour = {};
  events.forEach(ev => {
    if (ev.action === 'confirmed') {
      const h = (ev.timestamp||'').slice(11,13) + ':00';
      confByHour[h] = (confByHour[h] || 0) + 1;
    }
  });
  const hours = Object.keys(confByHour).sort();
  mkChart('chart-confirmations', 'line', hours, [{
    label: 'Confirmations',
    data: hours.map(h => confByHour[h]),
    borderColor: '#3fb950', backgroundColor: '#1a3a1f',
    fill: true, tension: 0.3, pointRadius: 4
  }]);
}

function toggleEdit(id) {
  const row = document.getElementById(`edit-row-${id}`);
  if (row) row.style.display = row.style.display === 'none' ? 'table-row' : 'none';
}

async function saveEdit(id) {
  const day   = document.getElementById(`edit-day-${id}`)?.value.trim();
  const time  = document.getElementById(`edit-time-${id}`)?.value.trim();
  const event = document.getElementById(`edit-event-${id}`)?.value.trim();
  const body = {};
  if (day)   body.day   = day;
  if (time)  body.time  = time;
  if (event) body.event = event;
  const res = await fetch(`/debug/routine/${id}`, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const data = await res.json();
  if (data.ok) { fetchData(); }
  else { alert(`Σφάλμα: ${data.error}`); }
}

function startCountdown() {
  cancelAnimationFrame(rafId);
  const bar = document.getElementById('refresh-bar');
  const start = performance.now();
  function tick(now) {
    const p = Math.min(100, (now-start)/REFRESH*100);
    bar.style.width = p+'%';
    if (now-start < REFRESH) rafId = requestAnimationFrame(tick);
    else { fetchData(); startCountdown(); }
  }
  rafId = requestAnimationFrame(tick);
}

fetchData();
fetchTimeline();
setInterval(fetchTimeline, 30000);
startCountdown();
</script>
