<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astakos — AI Companion</title>
    <style>
        /* ══════════════════════════════════════════════════════
           RESET & BASE COLOR PALETTE (Futuristic Companion)
        ══════════════════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:            #080c14;
            --surface:       #0e1422;
            --surface2:      #131b2e;
            --surface3:      #1a243c;
            --border:        #212e47;
            --border-subtle: rgba(42, 58, 88, 0.45);
            --accent:        #38bdf8;
            --accent-glow:   rgba(56, 189, 248, 0.4);
            --accent2:       #0ea5e9;
            --violet:        #818cf8;
            --violet-glow:   rgba(129, 140, 248, 0.35);
            --green:         #34d399;
            --yellow:        #fbbf24;
            --red:           #fb7185;
            --text:          #e2e8f0;
            --text-dim:      #8190a6;
            --bubble-ai:     #111827;
            --bubble-user:   #0f769e;
            --shadow-soft:   0 14px 36px rgba(0, 0, 0, 0.32);
            --shadow-core:   0 0 25px rgba(56, 189, 248, 0.25);
        }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }
        body { display: flex; flex-direction: column; }

        /* ══ HEADER ══════════════════════════════════════════ */
        #header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            height: 52px;
            background: rgba(14, 20, 34, 0.96);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            gap: 12px;
            z-index: 30;
        }
        #header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
        #header-logo {
            display: grid;
            place-items: center;
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: radial-gradient(circle at 35% 35%, rgba(56,189,248,0.25), rgba(129,140,248,0.1) 80%);
            border: 1px solid rgba(56,189,248,0.35);
            box-shadow: 0 0 12px rgba(56,189,248,0.2);
            flex-shrink: 0;
        }
        #header-logo svg { width: 20px; height: 20px; }
        #header-title { font-size: 14px; font-weight: 750; color: #f8fafc; letter-spacing: 0.08em; line-height: 1.1; }
        #header-subtitle { font-size: 10px; color: var(--text-dim); letter-spacing: 0.06em; margin-top: 2px; }

        #ws-status {
            display: flex; align-items: center; gap: 6px;
            font-size: 11px; color: var(--text-dim);
            padding: 3px 10px; border-radius: 99px;
            background: rgba(19, 27, 46, 0.8); border: 1px solid var(--border);
        }
        #ws-dot { width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; transition: background 0.3s; }

        #header-buttons { display: flex; align-items: center; gap: 6px; }

        .hbtn {
            display: flex; align-items: center; gap: 5px;
            padding: 5px 12px; height: 32px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--surface2);
            color: var(--text); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.18s; white-space: nowrap;
        }
        .hbtn:hover { background: var(--surface3); border-color: var(--accent); color: var(--accent); }
        #end-session-btn { border-color: #3e1616; color: var(--red); }
        #end-session-btn:hover { background: #290d0d; border-color: var(--red); }

        /* ══ MAIN ROW ════════════════════════════════════════ */
        #main-row {
            display: flex;
            flex: 1;
            overflow: hidden;
            background: radial-gradient(ellipse at 50% 0%, rgba(56,189,248,0.04) 0%, transparent 60%), var(--bg);
        }

        /* ── CHAT PANEL ── */
        #chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }

        /* ── COMPANION HUD (Astakos Core Focal Point) ── */
        #companion-hud {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 148px;
            padding: 14px clamp(16px, 4vw, 48px);
            background: linear-gradient(180deg, rgba(14,20,34,0.94) 0%, rgba(10,14,24,0.85) 100%);
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(12px);
            flex-shrink: 0;
            gap: 16px;
            z-index: 15;
            position: relative;
            overflow: hidden;
        }
        #companion-hud::before,
        #companion-hud::after {
            content: '';
            position: absolute;
            pointer-events: none;
        }
        #companion-hud::before {
            inset: 0;
            background-image:
                linear-gradient(rgba(56,189,248,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56,189,248,0.045) 1px, transparent 1px);
            background-size: 22px 22px;
            mask-image: linear-gradient(90deg, transparent, black 20%, black 80%, transparent);
        }
        #companion-hud::after {
            width: min(940px, 92%);
            height: 1px;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, transparent, rgba(56,189,248,0.55) 20%, rgba(129,140,248,0.55) 80%, transparent);
        }

        #core-pod {
            display: flex;
            align-items: center;
            gap: 18px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s ease;
            outline: none;
            border-radius: 12px;
            padding: 8px 14px;
            position: relative;
            z-index: 1;
        }
        #core-pod:hover {
            transform: scale(1.02);
        }
        #core-pod:focus-visible {
            box-shadow: 0 0 0 2px var(--accent);
        }

        #core-orb-wrapper {
            position: relative;
            width: 112px;
            height: 112px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }

        #core-meta {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0;
        }
        #core-title-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #core-name {
            font-size: 15px;
            font-weight: 750;
            letter-spacing: 0.08em;
            color: #f1f5f9;
        }
        #core-mode-badge {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.08em;
            padding: 2px 7px;
            border-radius: 99px;
            text-transform: uppercase;
            background: rgba(56,189,248,0.12);
            color: var(--accent);
            border: 1px solid rgba(56,189,248,0.3);
            transition: all 0.25s ease;
        }
        #core-mode-badge.badge-listening {
            background: rgba(45,212,191,0.15);
            color: #2dd4bf;
            border-color: rgba(45,212,191,0.45);
            box-shadow: 0 0 10px rgba(45,212,191,0.25);
        }
        #core-mode-badge.badge-processing {
            background: rgba(245,158,11,0.15);
            color: #fbbf24;
            border-color: rgba(245,158,11,0.45);
            box-shadow: 0 0 10px rgba(245,158,11,0.2);
        }
        #core-mode-badge.badge-speaking {
            background: rgba(129,140,248,0.15);
            color: #a5b4fc;
            border-color: rgba(129,140,248,0.45);
            box-shadow: 0 0 10px rgba(129,140,248,0.25);
        }
        #core-mode-badge.badge-error {
            background: rgba(244,63,94,0.15);
            color: #fda4af;
            border-color: rgba(244,63,94,0.45);
        }
        #core-subtitle {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
        #core-hint {
            font-size: 10px;
            color: rgba(125,211,252,0.78);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        /* ── CHAT BOX & MESSAGES ── */
        #chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 22px clamp(16px, 4vw, 54px);
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }
        #chat-box::before { content: ""; margin-top: auto; }
        #chat-box::-webkit-scrollbar { width: 5px; }
        #chat-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

        .msg {
            width: fit-content;
            max-width: min(76ch, 80%);
            padding: 12px 16px;
            border-radius: 10px;
            line-height: 1.58;
            font-size: 14px;
            position: relative;
            word-break: break-word;
            box-shadow: var(--shadow-soft);
        }
        .msg-user {
            align-self: flex-end;
            background: linear-gradient(145deg, var(--bubble-user), #0891b2);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.15);
            border-bottom-right-radius: 3px;
        }
        .msg-ai {
            align-self: flex-start;
            background: var(--bubble-ai);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 3px;
            padding-right: 64px; /* room for action buttons */
        }
        .msg strong { color: #ffffff; font-weight: 700; }
        .msg a { color: #7dd3fc; text-decoration: none; border-bottom: 1px solid rgba(125,211,252,0.4); }
        .msg a:hover { border-bottom-color: #7dd3fc; }

        .agent-label {
            display: inline-flex;
            width: auto;
            margin: 0 0 8px;
            padding: 2px 7px;
            border-radius: 999px;
            background: rgba(56,189,248,0.09);
            color: var(--accent);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }
        .msg-user .agent-label { color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.12); }

        /* Message Action Buttons (Speaker & Copy) */
        .msg-action-group {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }
        .msg:hover .msg-action-group,
        .msg:focus-within .msg-action-group {
            opacity: 1;
        }
        .msg-action-btn {
            width: 26px;
            height: 24px;
            display: grid;
            place-items: center;
            border-radius: 5px;
            background: rgba(3, 7, 18, 0.7);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .msg-action-btn:hover {
            background: var(--surface3);
            border-color: var(--accent);
            color: var(--accent);
        }
        .msg-action-btn.speaking-active {
            background: rgba(129,140,248,0.25);
            border-color: #818cf8;
            color: #c4b5fd;
            animation: speakBtnPulse 0.8s ease-in-out infinite alternate;
        }
        @keyframes speakBtnPulse {
            0% { transform: scale(0.96); box-shadow: 0 0 6px rgba(129,140,248,0.3); }
            100% { transform: scale(1.06); box-shadow: 0 0 12px rgba(129,140,248,0.7); }
        }

        .chat-img { max-width: 100%; border-radius: 8px; margin-top: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.45); }

        .loading {
            align-self: flex-start;
            font-size: 13px;
            color: var(--text-dim);
            margin-left: clamp(4px, 2vw, 20px);
            padding: 8px 14px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(17, 24, 39, 0.85);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .loading::before {
            content: ''; width: 8px; height: 8px; border-radius: 50%;
            background: var(--accent); display: inline-block;
            box-shadow: 0 0 8px var(--accent);
            animation: pulse-dot 1s infinite;
        }
        @keyframes pulse-dot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.35;transform:scale(0.7)} }

        /* ── INPUT CONTAINER ── */
        #input-container {
            padding: 12px clamp(14px, 3vw, 48px) 16px;
            background: linear-gradient(180deg, rgba(8,12,20,0) 0%, rgba(8,12,20,0.92) 22%, var(--surface) 100%);
            border-top: 1px solid rgba(33, 46, 71, 0.8);
            flex-shrink: 0;
        }
        #input-area {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .input-btn {
            height: 44px;
            min-width: 44px;
            padding: 0;
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.18s;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .input-btn:hover { border-color: var(--accent); background: var(--surface3); }

        #live-voice-btn.live-active {
            background: rgba(45, 212, 191, 0.16);
            border-color: #2dd4bf;
            color: #99f6e4;
        }

        #trigger-voice-btn.mic-recording {
            background: rgba(244,63,94,0.2) !important;
            border-color: var(--red) !important;
            color: var(--red) !important;
            animation: micPulse 1.2s ease-in-out infinite;
        }

        #live-voice-exit-btn {
            display: none;
        }

        body.live-voice-active {
            overflow: hidden;
        }
        body.live-voice-active #companion-hud {
            position: fixed;
            inset: 0;
            z-index: 40;
            min-height: 100dvh;
            background: rgba(3, 7, 18, 0.96);
        }
        body.live-voice-active #core-pod {
            transform: scale(1.35);
            cursor: default;
        }
        body.live-voice-active #core-hint {
            color: #99f6e4;
        }
        body.live-voice-active #live-voice-exit-btn {
            display: inline-flex;
            position: absolute;
            top: 24px;
            right: 24px;
            align-items: center;
            justify-content: center;
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid rgba(148, 163, 184, 0.5);
            border-radius: 8px;
            background: rgba(15, 23, 42, 0.88);
            color: var(--text);
            font: inherit;
            cursor: pointer;
        }
        body.live-voice-active #live-voice-exit-btn:hover,
        body.live-voice-active #live-voice-exit-btn:focus-visible {
            border-color: #fda4af;
            color: #fecdd3;
        }
        body.live-voice-active #chat-box,
        body.live-voice-active #input-container {
            opacity: 0.18;
            pointer-events: none;
        }
        @keyframes micPulse {
            0% { box-shadow: 0 0 0 0 rgba(244,63,94,0.7); }
            70% { box-shadow: 0 0 0 12px rgba(244,63,94,0); }
            100% { box-shadow: 0 0 0 0 rgba(244,63,94,0); }
        }

        #user-input {
            flex: 1;
            min-height: 44px;
            max-height: 200px;
            padding: 11px 14px;
            background: #0b101c;
            border: 1px solid #24324d;
            border-radius: 8px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            min-width: 0;
            resize: none;
            overflow-y: hidden;
            line-height: 1.45;
            font-family: inherit;
        }
        #user-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.14);
        }
        #user-input::placeholder { color: var(--text-dim); }

        #send-btn {
            height: 44px;
            min-width: 110px;
            padding: 0 18px;
            background: linear-gradient(145deg, #0284c7, #0ea5e9);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.04em;
            transition: all 0.18s;
            flex-shrink: 0;
        }
        #send-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }

        #file-label {
            max-width: 1180px;
            margin: 7px auto 0;
            font-size: 11px;
            color: var(--green);
            font-style: italic;
        }

        /* ── TERMINAL PANEL (Logs Sidebar) ── */
        #terminal-panel {
            width: 420px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #05080f;
            border-left: 1px solid var(--border);
            transition: width 0.25s ease;
            overflow: hidden;
        }
        #terminal-panel.hidden-panel { width: 0 !important; border: none !important; }

        #terminal-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0;
        }
        #terminal-header-title {
            font-family: 'Consolas', monospace; font-size: 12px; font-weight: 700;
            color: var(--green); letter-spacing: 0.08em;
            display: flex; align-items: center; gap: 7px;
        }
        #terminal-header-title::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: var(--green); display: inline-block; animation: pulse-dot 2s infinite;
        }
        #log-box {
            flex: 1; padding: 12px; overflow-y: auto;
            font-family: 'Consolas', monospace; font-size: 11px;
            color: #94a3b8; white-space: pre-wrap; word-wrap: break-word; line-height: 1.5;
        }
        #log-box::-webkit-scrollbar { width: 4px; }
        #log-box::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 99px; }

        /* ══════════════════════════════════════════════════════
           ASTAKOS CORE SVG & STATE ANIMATIONS
        ══════════════════════════════════════════════════════ */
        .core-orbit {
            transform-origin: 60px 60px;
        }
        .core-particles-outer, .core-particles-middle {
            transform-origin: 60px 60px;
        }
        .core-nucleus {
            transform-origin: 60px 60px;
            transition: fill 0.4s ease, filter 0.4s ease;
        }

        /* State 1: IDLE */
        .state-idle .core-orbit-outer {
            animation: coreRotateCW 26s linear infinite;
        }
        .state-idle .core-particles-outer {
            animation: coreRotateCW 26s linear infinite;
        }
        .state-idle .core-orbit-middle {
            animation: coreRotateCCW 18s linear infinite;
        }
        .state-idle .core-particles-middle {
            animation: coreRotateCCW 18s linear infinite;
        }
        .state-idle .core-orbit-inner {
            animation: coreRotateCW 12s linear infinite;
        }
        .state-idle .core-nucleus {
            animation: coreBreathe 4.5s ease-in-out infinite;
            fill: url(#nucleusGradIdle);
        }
        .state-idle .core-aura {
            animation: auraPulse 4.5s ease-in-out infinite;
            fill: url(#nucleusGradIdle);
        }

        /* State 2: LISTENING */
        .state-listening .core-orbit-outer {
            stroke: #2dd4bf;
            animation: coreRotateCW 8s linear infinite;
        }
        .state-listening .core-orbit-middle {
            stroke: #38bdf8;
            animation: coreRotateCCW 6s linear infinite;
        }
        .state-listening .core-nucleus {
            fill: url(#nucleusGradListen);
            animation: coreListenPulse 1.1s ease-in-out infinite alternate;
        }
        .state-listening .core-aura {
            fill: url(#nucleusGradListen);
            animation: auraListen 1.1s ease-in-out infinite alternate;
        }
        .state-listening .core-sonar-ring {
            animation: coreSonar 1.4s ease-out infinite;
        }

        /* State 3: PROCESSING */
        .state-processing .core-orbit-outer {
            stroke: #38bdf8;
            stroke-dasharray: 16 8 8 8;
            animation: coreRotateCW 2.4s linear infinite;
        }
        .state-processing .core-orbit-middle {
            stroke: #f59e0b;
            stroke-dasharray: 24 12 12 12;
            animation: coreRotateCCW 1.8s linear infinite;
        }
        .state-processing .core-particles-outer,
        .state-processing .core-particles-middle {
            animation: coreRotateCW 2.4s linear infinite;
        }
        .state-processing .core-nucleus {
            fill: url(#nucleusGradProcess);
            animation: coreProcessPulse 1.1s ease-in-out infinite alternate;
        }
        .state-processing .core-aura {
            fill: url(#nucleusGradProcess);
            opacity: 0.6;
        }

        /* State 4: SPEAKING */
        .state-speaking .core-orbit-outer {
            stroke: #818cf8;
            animation: coreRotateCW 12s linear infinite;
        }
        .state-speaking .core-orbit-middle {
            stroke: #38bdf8;
            animation: coreRotateCCW 9s linear infinite;
        }
        .state-speaking .core-nucleus {
            fill: url(#nucleusGradSpeak);
            animation: coreSpeakPulse 0.8s ease-in-out infinite alternate;
        }
        .state-speaking .core-aura {
            fill: url(#nucleusGradSpeak);
        }
        .state-speaking .core-waveform {
            opacity: 1;
            transition: opacity 0.3s ease;
        }
        .state-speaking .wb1 { animation: waveOscillate 0.5s ease-in-out infinite alternate; }
        .state-speaking .wb2 { animation: waveOscillate 0.65s ease-in-out 0.1s infinite alternate; }
        .state-speaking .wb3 { animation: waveOscillate 0.45s ease-in-out 0.05s infinite alternate; }
        .state-speaking .wb4 { animation: waveOscillate 0.6s ease-in-out 0.15s infinite alternate; }
        .state-speaking .wb5 { animation: waveOscillate 0.52s ease-in-out 0.2s infinite alternate; }

        /* State 5: ERROR */
        .state-error .core-orbit-outer {
            stroke: #f43f5e;
            animation: coreRotateCW 32s linear infinite;
        }
        .state-error .core-orbit-middle {
            stroke: #fb7185;
        }
        .state-error .core-nucleus {
            fill: url(#nucleusGradError);
            animation: coreErrorGlow 2s ease-in-out infinite;
        }
        .state-error .core-aura {
            fill: url(#nucleusGradError);
            opacity: 0.5;
        }

        /* Keyframe definitions */
        @keyframes coreRotateCW { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes coreRotateCCW { from { transform: rotate(360deg); } to { transform: rotate(0deg); } }
        @keyframes coreBreathe {
            0%, 100% { transform: scale(0.95); opacity: 0.88; }
            50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 10px rgba(56,189,248,0.7)); }
        }
        @keyframes auraPulse {
            0%, 100% { transform: scale(0.92); opacity: 0.35; }
            50% { transform: scale(1.08); opacity: 0.6; }
        }
        @keyframes coreListenPulse {
            0% { transform: scale(0.92); filter: drop-shadow(0 0 8px rgba(45,212,191,0.6)); }
            100% { transform: scale(1.12); filter: drop-shadow(0 0 18px rgba(45,212,191,0.95)); }
        }
        @keyframes auraListen {
            0% { transform: scale(0.9); opacity: 0.4; }
            100% { transform: scale(1.15); opacity: 0.75; }
        }
        @keyframes coreSonar {
            0% { r: 24px; opacity: 0.9; stroke-width: 2px; }
            100% { r: 52px; opacity: 0; stroke-width: 0.5px; }
        }
        @keyframes coreProcessPulse {
            0% { transform: scale(0.94); filter: drop-shadow(0 0 8px rgba(245,158,11,0.6)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 16px rgba(56,189,248,0.85)); }
        }
        @keyframes coreSpeakPulse {
            0% { transform: scale(0.96); filter: drop-shadow(0 0 8px rgba(129,140,248,0.6)); }
            100% { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(129,140,248,0.9)); }
        }
        @keyframes waveOscillate {
            0% { y1: 56px; y2: 64px; }
            100% { y1: 44px; y2: 76px; }
        }
        @keyframes coreErrorGlow {
            0%, 100% { transform: scale(0.98); filter: drop-shadow(0 0 8px rgba(244,63,94,0.6)); }
            50% { transform: scale(1.04); filter: drop-shadow(0 0 14px rgba(244,63,94,0.9)); }
        }

        /* Reduced Motion Media Query */
        @media (prefers-reduced-motion: reduce) {
            .core-orbit,
            .core-particles-outer,
            .core-particles-middle,
            .core-nucleus,
            .core-aura,
            .core-sonar-ring,
            .wave-bar,
            .loading::before,
            #trigger-voice-btn.mic-recording,
            .msg-action-btn.speaking-active {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ── RESPONSIVE STYLES ── */
        @media (max-width: 980px) {
            #companion-hud { min-height: 128px; }
            #terminal-panel {
                position: fixed;
                right: 0;
                top: 52px;
                bottom: 0;
                width: min(92vw, 420px);
                z-index: 40;
                box-shadow: -18px 0 40px rgba(0,0,0,0.45);
            }
            #terminal-panel.hidden-panel { width: 0 !important; }
            .msg { max-width: 88%; }
        }

        @media (max-width: 560px) {
            #header { height: auto; min-height: 52px; padding: 8px 12px; flex-wrap: wrap; }
            #header-subtitle { display: none; }
            #ws-status { order: 3; width: 100%; justify-content: center; }
            #header-buttons { margin-left: auto; }
            .hbtn { padding: 0 9px; font-size: 11px; }

            #companion-hud { min-height: 106px; padding: 8px 12px; }
            #core-pod { gap: 11px; padding: 5px; }
            #core-orb-wrapper { width: 82px; height: 82px; }
            #core-orb-wrapper svg { width: 82px; height: 82px; }
            #core-name { font-size: 13px; }
            #core-hint { font-size: 9px; letter-spacing: 0.05em; }
            body.live-voice-active #core-pod { transform: scale(1.08); }
            body.live-voice-active #live-voice-exit-btn { top: 12px; right: 12px; }

            #chat-box { padding: 12px 10px; gap: 12px; }
            .msg { max-width: 94%; font-size: 13.5px; padding: 10px 12px; }
            .msg-ai { padding-right: 58px; }
            .msg-action-group { opacity: 0.9; } /* touch-friendly on mobile */

            #input-container { padding: 8px 10px 12px; }
            #input-area { gap: 6px; }
            .input-btn { min-width: 42px; width: 42px; }
            #send-btn { min-width: 52px; width: 52px; padding: 0; font-size: 0; }
            #send-btn::before { content: "▶"; font-size: 16px; }
        }
    </style>
</head>
<body>

                                <stop offset="40%" stop-color="#2dd4bf" stop-opacity="0.9"/>

                                <stop offset="100%" stop-color="#04121e" stop-opacity="0"/>
                            </radialGradient>

<!-- ══ SCRIPTS ══════════════════════════════════════════════ -->
<script>
    const chatBox       = document.getElementById('chat-box');
    const userInput     = document.getElementById('user-input');
    const sendBtn       = document.getElementById('send-btn');
    const fileInput     = document.getElementById('file-input');
    const attachBtn     = document.getElementById('attach-btn');
    const fileLabel     = document.getElementById('file-label');
    const toggleBtn     = document.getElementById('toggle-logs-btn');
    const endSessionBtn = document.getElementById('end-session-btn');
    const terminalPanel = document.getElementById('terminal-panel');

    let currentPhotoPath = null;
    let pastedVirtualFile = null;
    const PASTE_AS_FILE_THRESHOLD = 700;

    toggleBtn.addEventListener('click', () => { terminalPanel.classList.toggle('hidden-panel'); });

    endSessionBtn.addEventListener('click', async () => {
        if (!confirm("Everything will be archived and the UI will be cleared. Are you sure?")) return;
        try {
            await fetch('/end_session', { method: 'POST' });
            chatBox.innerHTML = '';
            appendMessage("✅ Session archived. Starting a new page!", "ai", "System");
            currentPhotoPath = null;
        } catch (error) { alert("Connection error."); }
    });

    attachBtn.addEventListener('click', () => { fileInput.click(); });
    fileInput.addEventListener('change', (e) => {
        pastedVirtualFile = null;
        fileLabel.innerText = e.target.files.length > 0 ? "📎 Selected: " + e.target.files[0].name : "";
    });

    function escapeHtml(value) {
        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#39;");
    }

    function renderMessageText(text) {
        let processedText = escapeHtml(text);

        const scopedPhotoRegex = /\[ASTAKOS_ASSET_URL:\s*(\/(?:photos|outputs|avatars)\/[^\]\r\n]+)\]/g;
        processedText = processedText.replace(scopedPhotoRegex, (match, assetUrl) => {
            const cleanUrl = assetUrl.replace(/&amp;/g, "&");
            return `<br><img src="${escapeHtml(cleanUrl)}" class="chat-img" />`;
        });

        const photoRegex = /\[SEND_PHOTO:\s*(.*?)\]/g;
        processedText = processedText.replace(photoRegex, (match, filepath) => {
            const cleanPath = filepath.replace(/&amp;/g, "&");
            const filename = cleanPath.split('\\').pop().split('/').pop();
            return `<br><img src="/photos/${encodeURIComponent(filename)}" class="chat-img" />`;
        });

        const linkRegex = /\[(.*?)\]\((https?:\/\/.*?)\)/g;
        processedText = processedText.replace(linkRegex, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
        processedText = processedText.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        processedText = processedText.replace(/`([^`]+)`/g, '<code style="background:rgba(255,255,255,.08);padding:1px 5px;border-radius:4px;color:#dbeafe">$1</code>');
        processedText = processedText.replace(/\n/g, '<br>');
        return processedText;
    }

    /* ── Astakos Core State Engine ── */
    const coreSvg       = document.getElementById('astakos-core-svg');
    const coreModeBadge = document.getElementById('core-mode-badge');
    const coreSubtitle  = document.getElementById('core-subtitle');
    const corePod       = document.getElementById('core-pod');
    let currentCoreState = 'idle';

    const CORE_STATE_DETAILS = {
        idle: {
            badge: 'IDLE',
            badgeClass: '',
            subtitle: 'Ready for input',
        },
        listening: {
            badge: 'LISTENING',
            badgeClass: 'badge-listening',
            subtitle: 'Receiving voice stream…',
        },
        processing: {
            badge: 'PROCESSING',
            badgeClass: 'badge-processing',
            subtitle: 'Synthesizing response…',
        },
        speaking: {
            badge: 'SPEAKING',
            badgeClass: 'badge-speaking',
            subtitle: 'Transmitting audio…',
        },
        error: {
            badge: 'ATTENTION',
            badgeClass: 'badge-error',
            subtitle: 'Operation error',
        },
    };

    function setCoreState(state) {
        if (!CORE_STATE_DETAILS[state]) state = 'idle';
        currentCoreState = state;
        const details = CORE_STATE_DETAILS[state];

        if (coreSvg) {
            coreSvg.setAttribute('class', `state-${state}`);
        }
        if (coreModeBadge) {
            coreModeBadge.textContent = details.badge;
            coreModeBadge.className = details.badgeClass;
        }
        if (coreSubtitle) {
            coreSubtitle.textContent = details.subtitle;
        }
    }

    // Backward-compatibility alias
    function setAvatar(state) {
        const mapping = {
            'idle': 'idle',
            'listening': 'listening',
            'thinking': 'processing',
            'speaking': 'speaking',
            'error': 'error'
        };
        setCoreState(mapping[state] || 'idle');
    }

    /* ── TTS Playback Control (On-Demand) ── */
    let currentAudio = null;
    let activeSpeechBtn = null;
    let activeAudioUrl = null;
    let activeTtsController = null;
    let ttsPlaybackGeneration = 0;

    function resetOnDemandSpeechButton() {
        if (!activeSpeechBtn) return;
        activeSpeechBtn.innerHTML = '🔊';
        activeSpeechBtn.classList.remove('speaking-active');
        activeSpeechBtn = null;
    }

    function stopOnDemandSpeech(setIdle = true) {
        ttsPlaybackGeneration += 1;
        if (activeTtsController) activeTtsController.abort();
        activeTtsController = null;
        if (currentAudio && activeSpeechBtn) {
            currentAudio.pause();
            currentAudio.onended = null;
            currentAudio.onerror = null;
            currentAudio = null;
        }
        if (activeAudioUrl) {
            URL.revokeObjectURL(activeAudioUrl);
            activeAudioUrl = null;
        }
        resetOnDemandSpeechButton();
        if (setIdle) setCoreState('idle');
    }

    async function toggleSpeakMessage(text, btn) {
        if (activeSpeechBtn === btn) {
            stopOnDemandSpeech();
            return;
        }

        let cleanText = String(text || "")
            .replace(/[*#`]/g, '')
            .replace(/\[SEND_PHOTO:.*?\]/g, '')
            .replace(/\[ASTAKOS_ASSET_URL:.*?\]/g, '')
            .replace(/\[(.*?)\]\(.*?\)/g, '$1')
            .replace(/^\[.*?\]:\s*/g, '')
            .trim();
        if (!cleanText) return;

        stopOnDemandSpeech(false);
        const playbackGeneration = ++ttsPlaybackGeneration;
        const controller = new AbortController();
        activeTtsController = controller;
        activeSpeechBtn = btn;
        btn.innerHTML = '⏹️';
        btn.classList.add('speaking-active');
        setCoreState('speaking');

        try {
            const response = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: cleanText }),
                signal: controller.signal,
            });
            if (!response.ok) throw new Error('TTS request failed');
            const audioBlob = await response.blob();
            if (playbackGeneration !== ttsPlaybackGeneration) return;
            const audioUrl = URL.createObjectURL(audioBlob);
            if (playbackGeneration !== ttsPlaybackGeneration) {
                URL.revokeObjectURL(audioUrl);
                return;
            }
            activeAudioUrl = audioUrl;
            const audio = new Audio(audioUrl);
            currentAudio = audio;
            audio.onended = () => {
                if (playbackGeneration !== ttsPlaybackGeneration) return;
                stopOnDemandSpeech(false);
                setCoreState('idle');
            };
            audio.onerror = () => {
                if (playbackGeneration !== ttsPlaybackGeneration) return;
                stopOnDemandSpeech(false);
                setCoreState('error');
                setTimeout(() => setCoreState('idle'), 3000);
            };
            await audio.play();
        } catch (err) {
            if (playbackGeneration !== ttsPlaybackGeneration || controller.signal.aborted) return;
            console.error('[TTS Error]:', err);
            stopOnDemandSpeech(false);
            setCoreState('error');
            setTimeout(() => setCoreState('idle'), 3000);
        }
    }

    function appendMessage(text, sender, agentName = "") {
        const div = document.createElement('div');
        div.className = `msg ${sender === 'user' ? 'msg-user' : 'msg-ai'}`;

        let innerHTML = '';
        if (agentName) innerHTML += `<span class="agent-label">${escapeHtml(agentName)}</span>`;

        innerHTML += renderMessageText(text);
        div.innerHTML = innerHTML;

        // Action Group
        const actionGroup = document.createElement('div');
        actionGroup.className = 'msg-action-group';

        if (sender === 'ai') {
            const speakBtn = document.createElement('button');
            speakBtn.className = 'msg-action-btn speak-btn';
            speakBtn.title = "Read message aloud";
            speakBtn.setAttribute('aria-label', "Read message aloud");
            speakBtn.innerHTML = '🔊';
            speakBtn.onclick = () => toggleSpeakMessage(text, speakBtn);
            actionGroup.appendChild(speakBtn);
        }

        const copyBtn = document.createElement('button');
        copyBtn.className = 'msg-action-btn copy-btn';
        copyBtn.title = "Copy message";
        copyBtn.setAttribute('aria-label', "Copy message");
        copyBtn.innerHTML = '📋';
        copyBtn.onclick = () => {
            navigator.clipboard.writeText(text).then(() => {
                copyBtn.innerHTML = '✅';
                setTimeout(() => { copyBtn.innerHTML = '📋'; }, 2000);
            }).catch(err => console.error("Failed to copy:", err));
        };
        actionGroup.appendChild(copyBtn);

        div.appendChild(actionGroup);
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* ── Telegram Live Refresh & History ── */
    let lastKnownMsgId = 0;
    const renderedHistoryRowIds = new Set();
    const pendingLocalEchoes = [];
    const recentRenderedMessages = [];
    let isFetchingMessages = false;
    let isInitialCursorInitialized = false;
    const INITIAL_HISTORY_TIMEOUT_MS = 10000;

    async function fetchJsonWithTimeout(url, timeoutMs) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
            const response = await fetch(url, { signal: controller.signal });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return await response.json();
        } finally {
            clearTimeout(timeoutId);
        }
    }

    function getMessageStableId(msg) {
        return msg?.rowid || msg?.id || null;
    }

    function markRenderedRowId(rowid) {
        const stableId = Number(rowid) || rowid;
        if (stableId) {
            renderedHistoryRowIds.add(stableId);
            if (Number(stableId) > lastKnownMsgId) lastKnownMsgId = Number(stableId);
        }
    }

    function normalizeEchoText(text) {
        return String(text || "")
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/<[^>]+>/g, "")
            .replace(/[\u200B-\u200D\uFEFF]/g, "")
            .replace(/\s+/g, " ")
            .trim();
    }

    function pushLocalEcho(role, text) {
        pendingLocalEchoes.push({
            role,
            text: normalizeEchoText(text),
            expiresAt: Date.now() + 60000,
        });
    }

    function consumeMatchingLocalEcho(role, text) {
        const normalized = normalizeEchoText(text);
        const now = Date.now();

        for (let i = 0; i < pendingLocalEchoes.length; i++) {
            const item = pendingLocalEchoes[i];
            if (item.expiresAt < now) {
                pendingLocalEchoes.splice(i, 1);
                i--;
                continue;
            }
            if (item.role === role && item.text === normalized) {
                pendingLocalEchoes.splice(i, 1);
                return true;
            }
        }
        return false;
    }

    function markRecentlyRendered(role, text) {
        const normalized = normalizeEchoText(text);
        const now = Date.now();
        for (let i = recentRenderedMessages.length - 1; i >= 0; i--) {
            if (recentRenderedMessages[i].expiresAt < now) recentRenderedMessages.splice(i, 1);
        }
        recentRenderedMessages.push({
            role,
            text: normalized,
            expiresAt: now + 60000,
        });
    }

    function wasRecentlyRendered(role, text) {
        const normalized = normalizeEchoText(text);
        const now = Date.now();
        for (let i = recentRenderedMessages.length - 1; i >= 0; i--) {
            const item = recentRenderedMessages[i];
            if (item.expiresAt < now) {
                recentRenderedMessages.splice(i, 1);
                continue;
            }
            if (item.role === role && item.text === normalized) {
                return true;
            }
        }
        return false;
    }

    function appendAssistantResponseOnce(text, agentName = "") {
        if (wasRecentlyRendered('ai', text)) return;
        pushLocalEcho('ai', text);
        appendMessage(text, 'ai', agentName);
        markRecentlyRendered('ai', text);
    }

    function appendUserMessageOnce(text) {
        if (wasRecentlyRendered('user', text)) return;
        pushLocalEcho('user', text);
        appendMessage(text, 'user');
        markRecentlyRendered('user', text);
    }

    function renderHistoryMsg(msg) {
        const stableId = getMessageStableId(msg);
        if (stableId && renderedHistoryRowIds.has(stableId)) return;

        const sender = (msg.role === 'user' || msg.role === 'Human') ? 'user' : 'ai';
        const defaultName = sender === 'user' ? 'User' : 'Astakos';
        const channelName = msg.channel ? `${msg.channel.charAt(0).toUpperCase()}${msg.channel.slice(1)}` : '';
        const label = channelName ? `${channelName} / ${msg.agent || defaultName}` : (msg.agent || defaultName);

        if (wasRecentlyRendered(sender, msg.content) || consumeMatchingLocalEcho(sender, msg.content)) {
            if (stableId) renderedHistoryRowIds.add(stableId);
            if (msg.rowid && msg.rowid > lastKnownMsgId) lastKnownMsgId = msg.rowid;
            return;
        }

        appendMessage(msg.content, sender, label);
        markRecentlyRendered(sender, msg.content);

        if (stableId) renderedHistoryRowIds.add(stableId);
        if (msg.rowid && msg.rowid > lastKnownMsgId) lastKnownMsgId = msg.rowid;
    }

    async function fetchNewMessages() {
        if (isFetchingMessages) return;
        isFetchingMessages = true;
        try {
            const res = await fetch(`/messages/poll?after_id=${lastKnownMsgId}`);
            if (!res.ok) return;
            const data = await res.json();
            if (data.messages && data.messages.length > 0) {
                data.messages.sort((a, b) => (Number(a.rowid) || 0) - (Number(b.rowid) || 0));
                data.messages.forEach(renderHistoryMsg);
            }
            if (data.max_id && data.max_id > lastKnownMsgId) lastKnownMsgId = data.max_id;
        } catch (e) { /* skip when offline */ }
        finally { isFetchingMessages = false; }
    }

    window.addEventListener('DOMContentLoaded', async () => {
        try {
            const data = await fetchJsonWithTimeout('/history', INITIAL_HISTORY_TIMEOUT_MS);
            if (data.history && data.history.length > 0) {
                data.history.sort((a, b) => (Number(a.rowid) || 0) - (Number(b.rowid) || 0));
                data.history.forEach(msg => renderHistoryMsg(msg));
                const historyMaxRowId = Math.max(0, ...data.history.map(msg => Number(msg.rowid) || 0));
                if (historyMaxRowId > lastKnownMsgId) lastKnownMsgId = historyMaxRowId;
            } else {
                appendMessage("Astakos Jarvis System online. How may I assist you today?", "ai", "System");
            }
            if (!lastKnownMsgId) {
                try {
                    const pd = await fetchJsonWithTimeout('/messages/poll?after_id=0', INITIAL_HISTORY_TIMEOUT_MS);
                    if (pd.max_id) lastKnownMsgId = pd.max_id;
                } catch(e) {}
            }
            isInitialCursorInitialized = true;
        } catch (error) {
            console.error("History error:", error);
            try {
                let recoveryAfterId = 0;
                let recoveryMaxId = 0;
                while (true) {
                    const pollData = await fetchJsonWithTimeout(
                        `/messages/poll?after_id=${recoveryAfterId}`,
                        INITIAL_HISTORY_TIMEOUT_MS
                    );
                    if (!recoveryMaxId) recoveryMaxId = Number(pollData.max_id) || 0;

                    const messages = Array.isArray(pollData.messages) ? pollData.messages : [];
                    if (messages.length === 0) break;

                    messages.sort((a, b) => (Number(a.rowid) || 0) - (Number(b.rowid) || 0));
                    messages.forEach(renderHistoryMsg);

                    const pageLastRowId = Math.max(...messages.map(msg => Number(msg.rowid) || 0));
                    if (pageLastRowId <= recoveryAfterId || pageLastRowId >= recoveryMaxId) break;
                    recoveryAfterId = pageLastRowId;
                }
                if (recoveryMaxId > lastKnownMsgId) lastKnownMsgId = recoveryMaxId;
                isInitialCursorInitialized = true;
            } catch (pollError) {
                console.error("History cursor recovery error:", pollError);
            }
        }
        if (isInitialCursorInitialized) {
            _startPolling();
        }
    });

    function looksLikeCodePaste(text) {
        const t = String(text || "");
        if (!t.trim()) return false;

        const codeSignals = [
            "def ", "class ", "import ", "from ", "function ", "const ", "let ", "var ",
            "if __name__", "```", "{", "}", "SELECT ", "INSERT ", "UPDATE ", "DELETE ",
            "<html", "</", "attack_code"
        ];

        let hits = 0;
        const low = t.toLowerCase();
        for (const sig of codeSignals) {
            if (low.includes(sig.toLowerCase())) hits++;
        }

        const lineCount = t.split(/\r?\n/).length;
        return hits >= 2 || lineCount >= 12;
    }

    function buildVirtualPasteFile(text) {
        const now = new Date();
        const stamp = now.toISOString().replace(/[:.]/g, "-");
        const extension = looksLikeCodePaste(text) ? "py" : "txt";
        const mime = "text/plain;charset=utf-8";
        const filename = `paste_${stamp}.${extension}`;
        return new File([text], filename, { type: mime });
    }

    function setVirtualPasteFile(file, originalLength) {
        pastedVirtualFile = file;
        fileLabel.innerText = `📎 Paste converted to file: ${file.name} (${originalLength} chars, auto-attachment)`;
    }

    function clearPendingAttachmentUI() {
        pastedVirtualFile = null;
        fileInput.value = "";
        fileLabel.innerText = "";
    }

    userInput.addEventListener('paste', (e) => {
        const pastedText = e.clipboardData?.getData('text/plain') || "";
        if (!pastedText.trim()) return;

        const shouldConvertToFile =
            pastedText.length >= PASTE_AS_FILE_THRESHOLD || looksLikeCodePaste(pastedText);

        if (!shouldConvertToFile) return;

        e.preventDefault();

        const virtualFile = buildVirtualPasteFile(pastedText);
        setVirtualPasteFile(virtualFile, pastedText.length);

        if (!userInput.value.trim()) {
            userInput.value = "See the attached text and analyze it.";
            userInput.style.height = 'auto';
            userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
        }
    });

    async function sendMessage() {
        const text = userInput.value.trim();
        const file = fileInput.files[0] || pastedVirtualFile;
        if (!text && !file) return;

        let displayUserMsg = text;
        if (file && !text) displayUserMsg = `[File sent: ${file.name}]`;
        if (file && text)  displayUserMsg = `[File: ${file.name}]<br>${text}`;

        appendUserMessageOnce(displayUserMsg);
        userInput.value = '';
        clearPendingAttachmentUI();
        if (!isRecording && !isLiveVoiceMode) userInput.focus();

        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        loadingDiv.innerText = 'Astakos is processing...';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        setCoreState('processing');

        let isVoice = text.startsWith("[Voice Message]:");
        let apiText = text;
        if (isVoice) {
            let cleanMsg = text.replace("[Voice Message]:", "").trim();
            apiText = cleanMsg;
        }

        try {
            let response;
            if (file) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('message', apiText);
                response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();
                if (loadingDiv.parentNode) chatBox.removeChild(loadingDiv);
                appendAssistantResponseOnce(data.ai_message, 'Chat_Agent');
                currentPhotoPath = null;
                setCoreState('idle');
                return data.ai_message;
            } else {
                response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: apiText,
                        photo_path: currentPhotoPath,
                        voice_mode: isVoice,
                    })
                });
                const data = await response.json();
                if (loadingDiv.parentNode) chatBox.removeChild(loadingDiv);
                markRenderedRowId(data.user_rowid);
                markRenderedRowId(data.assistant_rowid);
                appendAssistantResponseOnce(data.response, data.agent);
                currentPhotoPath = null;
                setCoreState('idle');
                return data.response;
            }
        } catch (error) {
            if (loadingDiv.parentNode) chatBox.removeChild(loadingDiv);
            appendMessage("Error connecting to Astakos server.", 'ai', 'System');
            setCoreState('error');
            setTimeout(() => setCoreState('idle'), 4000);
            return null;
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = Math.min(userInput.scrollHeight, 200) + 'px';
    });

    /* ── Voice Recording & Interaction ── */
    const triggerBtn = document.getElementById('trigger-voice-btn');
    const liveVoiceBtn = document.getElementById('live-voice-btn');
    const liveVoiceExitBtn = document.getElementById('live-voice-exit-btn');
    const LIVE_SILENCE_DURATION_MS = 1500;
    const LIVE_SPEECH_CONFIRMATION_MS = 180;
    const LIVE_SPEECH_THRESHOLD = 0.018;
    const LIVE_WAKE_WORD = 'αστακε';
    const LIVE_CONVERSATION_IDLE_MS = 45000;
    const LIVE_STANDBY_PREROLL_CHUNKS = 3;
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;
    let isLiveVoiceMode = false;
    let liveSessionId = 0;
    let liveInputStream = null;
    let liveAudioContext = null;
    let liveSpeechAnimationFrame = null;
    let isLiveConversationActive = false;
    let liveConversationTimeout = null;
    let liveHasConfirmedSpeech = false;

    function setLiveVoiceModeUi(isActive) {
        document.body.classList.toggle('live-voice-active', isActive);
        liveVoiceBtn.classList.toggle('live-active', isActive);
        liveVoiceBtn.textContent = isActive ? 'STOP' : 'LIVE';
        liveVoiceBtn.setAttribute('aria-label', isActive ? 'End live voice conversation' : 'Start live voice conversation');
        corePod.setAttribute('aria-label', isActive ? 'End live voice conversation' : 'Astakos Core — Click to speak');
        document.getElementById('core-hint').textContent = isActive ? 'Standby · Say «Αστακέ»' : 'Click core to speak';
    }

    function normalizeLiveWakeText(text) {
        return text
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toLocaleLowerCase('el-GR');
    }

    function getLiveWakeWords(text) {
        return normalizeLiveWakeText(text).match(/\p{L}+/gu) || [];
    }

    function liveWakeWordEditDistance(left, right) {
        const previous = Array.from({ length: right.length + 1 }, (_, index) => index);
        for (let leftIndex = 1; leftIndex <= left.length; leftIndex += 1) {
            const current = [leftIndex];
            for (let rightIndex = 1; rightIndex <= right.length; rightIndex += 1) {
                const substitutionCost = left[leftIndex - 1] === right[rightIndex - 1] ? 0 : 1;
                current[rightIndex] = Math.min(
                    current[rightIndex - 1] + 1,
                    previous[rightIndex] + 1,
                    previous[rightIndex - 1] + substitutionCost,
                );
            }
            previous.splice(0, previous.length, ...current);
        }
        return previous[right.length];
    }

    function isLiveWakeWord(word) {
        if (Math.abs(word.length - LIVE_WAKE_WORD.length) > 1) return false;
        return liveWakeWordEditDistance(word, LIVE_WAKE_WORD) <= 1;
    }

    function hasLiveWakeWord(text) {
        return getLiveWakeWords(text).some(word => isLiveWakeWord(word));
    }

    function clearLiveConversationTimeout() {
        if (liveConversationTimeout) clearTimeout(liveConversationTimeout);
        liveConversationTimeout = null;
    }

    function showLiveStandby() {
        setCoreState('idle');
        coreModeBadge.textContent = 'STANDBY';
        coreModeBadge.className = 'badge-listening';
        coreSubtitle.textContent = 'Waiting for “Αστακέ”…';
        document.getElementById('core-hint').textContent = 'Standby · Say «Αστακέ»';
    }

    function activateLiveConversation(sessionId) {
        if (!isLiveVoiceMode || sessionId !== liveSessionId) return;
        clearLiveConversationTimeout();
        isLiveConversationActive = true;
        setCoreState('listening');
        document.getElementById('core-hint').textContent = 'Live conversation · Listening';
    }

    function returnLiveConversationToStandby(sessionId) {
        if (!isLiveVoiceMode || sessionId !== liveSessionId) return;
        clearLiveConversationTimeout();
        isLiveConversationActive = false;
        showLiveStandby();
    }

    function armLiveConversationTimeout(sessionId) {
        clearLiveConversationTimeout();
        if (!isLiveConversationActive || !isLiveVoiceMode || sessionId !== liveSessionId) return;
        liveConversationTimeout = setTimeout(
            () => returnLiveConversationToStandby(sessionId),
            LIVE_CONVERSATION_IDLE_MS,
        );
    }

    function getLiveAudioConstraints() {
        return {
            audio: {
                echoCancellation: true,
                noiseSuppression: true,
                autoGainControl: true,
            },
        };
    }

    function stopMediaStream(stream) {
        if (stream) stream.getTracks().forEach(track => track.stop());
    }

    function closeAudioContext(context) {
        if (context && context.state !== 'closed') context.close();
    }

    function stopLiveSpeechMonitor() {
        if (liveSpeechAnimationFrame) cancelAnimationFrame(liveSpeechAnimationFrame);
        liveSpeechAnimationFrame = null;
        closeAudioContext(liveAudioContext);
        liveAudioContext = null;
    }

    function getAudioLevel(analyser) {
        const samples = new Uint8Array(analyser.fftSize);
        analyser.getByteTimeDomainData(samples);
        let sum = 0;
        for (const sample of samples) {
            const value = (sample - 128) / 128;
            sum += value * value;
        }
        return Math.sqrt(sum / samples.length);
    }

    function startLiveSpeechMonitor(analyser, sessionId) {
        let heardSpeech = false;
        let speechCandidateStartedAt = null;
        let lastSpeechAt = performance.now();

        function monitor() {
            if (!isLiveVoiceMode || sessionId !== liveSessionId || !isRecording) return;
            const audioLevel = getAudioLevel(analyser);
            const now = performance.now();
            if (audioLevel >= LIVE_SPEECH_THRESHOLD) {
                if (speechCandidateStartedAt === null) speechCandidateStartedAt = now;
                if (heardSpeech || now - speechCandidateStartedAt >= LIVE_SPEECH_CONFIRMATION_MS) {
                    heardSpeech = true;
                    liveHasConfirmedSpeech = true;
                    clearLiveConversationTimeout();
                    lastSpeechAt = now;
                }
            } else if (heardSpeech && now - lastSpeechAt >= LIVE_SILENCE_DURATION_MS) {
                stopLiveRecording(sessionId);
                return;
            } else if (!heardSpeech) {
                speechCandidateStartedAt = null;
            }
            liveSpeechAnimationFrame = requestAnimationFrame(monitor);
        }

        liveSpeechAnimationFrame = requestAnimationFrame(monitor);
    }

    function stopCurrentAudioForLiveMode() {
        stopOnDemandSpeech(false);
        if (!currentAudio) return;
        currentAudio.pause();
        currentAudio.onended = null;
        currentAudio.onerror = null;
        URL.revokeObjectURL(currentAudio.src);
        currentAudio = null;
        if (activeSpeechBtn) {
            activeSpeechBtn.innerHTML = '🔊';
            activeSpeechBtn.classList.remove('speaking-active');
            activeSpeechBtn = null;
        }
    }

    async function transcribeVoiceBlob(audioBlob, { suppressNoSpeechError = false } = {}) {
        if (audioBlob.size < 800) return { status: 'no_speech' };
        setCoreState('processing');
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'loading';
        loadingDiv.innerText = '🎙️ Transcribing voice...';
        chatBox.appendChild(loadingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;

        const formData = new FormData();
        formData.append('file', audioBlob, 'web_voice.webm');
        try {
            const res = await fetch('/voice', { method: 'POST', body: formData });
            const data = await res.json();
            if (loadingDiv.parentNode) chatBox.removeChild(loadingDiv);
            if (data.transcription) return { status: 'ok', transcription: data.transcription };
            if (data.no_speech === true) {
                if (!suppressNoSpeechError) {
                    appendMessage('❌ Voice error: ' + (data.error || 'Unable to transcribe'), 'ai', 'System');
                }
                return { status: 'no_speech' };
            }
            appendMessage('❌ Voice error: ' + (data.error || 'Unable to transcribe'), 'ai', 'System');
        } catch (error) {
            if (loadingDiv.parentNode) chatBox.removeChild(loadingDiv);
            appendMessage('❌ Connection failure during voice transcription.', 'ai', 'System');
        }
        return { status: 'error' };
    }

    async function processLiveRecording(audioBlob, sessionId) {
        const result = await transcribeVoiceBlob(audioBlob, { suppressNoSpeechError: true });
        if (!isLiveVoiceMode || sessionId !== liveSessionId) return;
        if (result.status === 'no_speech') {
            startLiveListening(sessionId);
            return;
        }
        if (result.status !== 'ok') {
            stopLiveVoiceMode();
            return;
        }
        if (!isLiveConversationActive) {
            if (!hasLiveWakeWord(result.transcription)) {
                showLiveStandby();
                startLiveListening(sessionId);
                return;
            }
            activateLiveConversation(sessionId);
        }
        clearLiveConversationTimeout();
        userInput.value = '[Voice Message]: ' + result.transcription;
        const reply = await sendMessage();
        if (!isLiveVoiceMode || sessionId !== liveSessionId) return;
        if (!reply) {
            stopLiveVoiceMode();
            return;
        }
        await playLiveReply(reply, sessionId);
    }

    async function playLiveReply(text, sessionId) {
        setCoreState('speaking');
        try {
            const response = await fetch('/tts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text }),
            });
            if (!response.ok) throw new Error('TTS request failed');
            const audioBlob = await response.blob();
            if (!isLiveVoiceMode || sessionId !== liveSessionId) return;
            const audioUrl = URL.createObjectURL(audioBlob);
            if (!isLiveVoiceMode || sessionId !== liveSessionId) {
                URL.revokeObjectURL(audioUrl);
                return;
            }
            const audio = new Audio(audioUrl);
            currentAudio = audio;
            audio.onended = () => {
                URL.revokeObjectURL(audioUrl);
                if (currentAudio === audio) currentAudio = null;
                if (isLiveVoiceMode && sessionId === liveSessionId) startLiveListening(sessionId);
            };
            audio.onerror = () => {
                URL.revokeObjectURL(audioUrl);
                if (currentAudio === audio) currentAudio = null;
                if (isLiveVoiceMode && sessionId === liveSessionId) stopLiveVoiceMode();
            };
            await audio.play();
        } catch (error) {
            if (isLiveVoiceMode && sessionId === liveSessionId) stopLiveVoiceMode();
        }
    }

    function stopLiveRecording(sessionId) {
        if (sessionId !== liveSessionId || !isRecording) return;
        clearLiveConversationTimeout();
        stopLiveSpeechMonitor();
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        stopMediaStream(liveInputStream);
        liveInputStream = null;
        isRecording = false;
    }

    async function startLiveListening(sessionId) {
        if (!isLiveVoiceMode || sessionId !== liveSessionId || isRecording || currentAudio) return;
        try {
            liveInputStream = await navigator.mediaDevices.getUserMedia(getLiveAudioConstraints());
            if (!isLiveVoiceMode || sessionId !== liveSessionId) {
                stopMediaStream(liveInputStream);
                liveInputStream = null;
                return;
            }
            mediaRecorder = new MediaRecorder(liveInputStream);
            audioChunks = [];
            liveHasConfirmedSpeech = false;
            mediaRecorder.ondataavailable = event => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                    if (!liveHasConfirmedSpeech && audioChunks.length > LIVE_STANDBY_PREROLL_CHUNKS + 1) {
                        // Keep chunk 0: it carries the WebM initialization data required by decoders.
                        audioChunks.splice(1, 1);
                    }
                }
            };
            mediaRecorder.onstop = () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                if (isLiveVoiceMode && sessionId === liveSessionId) processLiveRecording(audioBlob, sessionId);
            };
            liveAudioContext = new AudioContext();
            const source = liveAudioContext.createMediaStreamSource(liveInputStream);
            const analyser = liveAudioContext.createAnalyser();
            analyser.fftSize = 1024;
            source.connect(analyser);
            mediaRecorder.start(1000);
            isRecording = true;
            if (isLiveConversationActive) {
                setCoreState('listening');
                document.getElementById('core-hint').textContent = 'Live conversation · Listening';
                armLiveConversationTimeout(sessionId);
            } else {
                showLiveStandby();
            }
            startLiveSpeechMonitor(analyser, sessionId);
        } catch (error) {
            if (isLiveVoiceMode && sessionId === liveSessionId) stopLiveVoiceMode();
        }
    }

    function startLiveVoiceMode() {
        if (isLiveVoiceMode || isRecording) return;
        stopCurrentAudioForLiveMode();
        isLiveVoiceMode = true;
        isLiveConversationActive = false;
        liveSessionId += 1;
        setLiveVoiceModeUi(true);
        startLiveListening(liveSessionId);
    }

    function stopLiveVoiceMode() {
        if (!isLiveVoiceMode) return;
        isLiveVoiceMode = false;
        isLiveConversationActive = false;
        liveSessionId += 1;
        clearLiveConversationTimeout();
        stopLiveSpeechMonitor();
        if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        stopMediaStream(liveInputStream);
        liveInputStream = null;
        isRecording = false;
        if (currentAudio) {
            currentAudio.pause();
            currentAudio.onended = null;
            currentAudio.onerror = null;
            URL.revokeObjectURL(currentAudio.src);
            currentAudio = null;
        }
        setLiveVoiceModeUi(false);
        setCoreState('idle');
    }

    async function toggleRecording() {
        if (isLiveVoiceMode) {
            stopLiveVoiceMode();
            return;
        }
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm;codecs=opus' });
                    if (audioBlob.size < 800) {
                        alert("❌ Error: The microphone sent no audio! (" + audioBlob.size + " bytes). Check audio input settings.");
                        setCoreState('idle');
                        return;
                    }
                    const result = await transcribeVoiceBlob(audioBlob);
                    if (result.status === 'ok') {
                        userInput.value = "[Voice Message]: " + result.transcription;
                        sendMessage();
                    } else {
                        setCoreState('error');
                        setTimeout(() => setCoreState('idle'), 4000);
                    }
                };
                mediaRecorder.start();
                isRecording = true;
                triggerBtn.classList.add('mic-recording');
                triggerBtn.innerHTML = "⏹️";
                setCoreState('listening');
            } catch (err) {
                alert("❌ Microphone access denied or unavailable.");
                setCoreState('error');
                setTimeout(() => setCoreState('idle'), 3000);
            }
        } else {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
            isRecording = false;
            triggerBtn.classList.remove('mic-recording');
            triggerBtn.innerHTML = "🎙️";
        }
    }

    triggerBtn.addEventListener('click', toggleRecording);
    liveVoiceBtn.addEventListener('click', () => {
        if (isLiveVoiceMode) stopLiveVoiceMode();
        else startLiveVoiceMode();
    });
    liveVoiceExitBtn.addEventListener('click', stopLiveVoiceMode);
    window.addEventListener('keydown', event => {
        if (event.key === 'Escape' && isLiveVoiceMode) stopLiveVoiceMode();
    });
    if (corePod) {
        corePod.addEventListener('click', toggleRecording);
        corePod.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                toggleRecording();
            }
        });
    }

    /* ── WebSocket Live Logs ── */
    const logBox  = document.getElementById('log-box');
    const wsDot   = document.getElementById('ws-dot');
    const wsLabel = document.getElementById('ws-label');

    const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
    const wsHost = window.location.host || '127.0.0.1:8000';
    const ws = new WebSocket(`${wsProtocol}//${wsHost}/ws/logs`);

    let _pollInterval = null;
    function _startPolling() {
        if (!isInitialCursorInitialized || _pollInterval) return;
        fetchNewMessages();
        _pollInterval = setInterval(fetchNewMessages, 5000);
    }
    ws.onopen  = () => { wsDot.style.background = '#34d399'; wsLabel.textContent = 'Online'; _startPolling(); };
    ws.onclose = () => { wsDot.style.background = '#fb7185'; wsLabel.textContent = 'Offline'; _startPolling(); };

    function parseANSI(text) {
        return text
            .replace(/\x1b\[90m/g, '<span style="color:#808080;">')
            .replace(/\x1b\[91m/g, '<span style="color:#fb7185;">')
            .replace(/\x1b\[92m/g, '<span style="color:#34d399;">')
            .replace(/\x1b\[93m/g, '<span style="color:#fbbf24;">')
            .replace(/\x1b\[94m/g, '<span style="color:#60a5fa;">')
            .replace(/\x1b\[95m/g, '<span style="color:#c084fc;">')
            .replace(/\x1b\[96m/g, '<span style="color:#38bdf8;">')
            .replace(/\x1b\[0m/g,  '</span>');
    }

    ws.onmessage = function(event) {
        try {
            const evt = JSON.parse(event.data);
            if (evt.type === 'new_message' && (evt.channel === 'telegram' || evt.channel === 'web')) {
                if (evt.rowid && evt.content) {
                    renderHistoryMsg(evt);
                } else {
                    fetchNewMessages();
                }
                return;
            }
        } catch(e) { /* standard text log line */ }

        const span = document.createElement('span');
        span.innerHTML = parseANSI(event.data);
        logBox.appendChild(span);
        logBox.scrollTop = logBox.scrollHeight;

        const logLine = event.data;
        if (logLine.includes("[Vision]: Image analysis") ||
            logLine.includes("LangGraph is executing") ||
            logLine.includes("[Dev]: Executing") ||
            logLine.includes("[LinkedIn]:")) {
            if (currentCoreState === 'idle') {
                setCoreState('processing');
                setTimeout(() => { if (currentCoreState === 'processing') setCoreState('idle'); }, 4000);
            }
        }
    };

    // ── Google Drive upload on-demand ──────────────────────────
    async function astakosOpenDrive(btn) {
        const path = btn.getAttribute('data-path');
        if (!path) return;
        btn.disabled = true;
        btn.textContent = '⏳ Uploading...';
        try {
            const r = await fetch('/upload-to-drive', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ path })
            });
            const d = await r.json();
            if (d.ok) {
                btn.textContent = '📂 Open';
                btn.style.background = '#065f46';
                btn.disabled = false;
                btn.onclick = () => window.open(d.url, '_blank');

                const card = btn.closest('div');
                if (card) {
                    const fileId = d.url.match(/\/d\/([^/]+)\//)?.[1];
                    if (fileId) {
                        const previewUrl = `https://drive.google.com/file/d/${fileId}/preview`;
                        const wrap = document.createElement('div');
                        wrap.style.cssText = 'margin-top:8px;border-radius:8px;overflow:hidden;border:1px solid rgba(255,255,255,0.1);';
                        wrap.innerHTML = `<iframe src="${previewUrl}" width="100%" height="400"
                            frameborder="0" allowfullscreen
                            style="display:block;background:#0b101c;"></iframe>`;
                        card.parentNode.insertBefore(wrap, card.nextSibling);
                    }
                }
            } else {
                btn.textContent = '❌ ' + (d.error || 'Error');
                btn.style.background = '#9f1239';
            }
        } catch (e) {
            btn.textContent = '❌ Error';
            btn.style.background = '#9f1239';
        }
    }
    window.astakosOpenDrive = astakosOpenDrive;
</script>
</body>
</html>
